<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style><title>MAKYL · Control Topográfico Estructural</title><meta name="description" content="Control topográfico estructural MAKYL: nivelación de placas base (AISC 303 §7.5.1c), verticalidad de columnas (H/500) y deflexión de vigas, con validación contra el libro Excel de referencia."><meta name="color-scheme" content="light dark"></head><body>

<style>
/* ============================================================================
   MAKYL — Control Topográfico Estructural
   Tokens de color: extraídos de xl/styles.xml del libro
   Nivelacion_y_Verticalidad_MAKYL_Rev2.xlsx (no inventados).
   ========================================================================= */
:root{
  /* --- Identidad corporativa MAKYL (reporte: tablas y gráficos) --- */
  --mak-azul:        #1B5EA8;
  --mak-azul-osc:    #123F70;
  --mak-azul-med:    #9DB6D4;
  --mak-azul-cl:     #DCE9F7;
  --mak-azul-xcl:    #F3F7FC;
  --mak-oro:         #BF8F00;
  --mak-oro-osc:     #7A5C00;
  --mak-oro-cl:      #FFE082;
  --mak-oro-xcl:     #FFEB99;

  --ok-txt:   #1B5E20;  --ok-bg:   #C8E6C9;  --ok-bd:   #2E7D32;
  --warn-txt: #7A5C00;  --warn-bg: #FFE082;  --warn-bd: #BF8F00;
  --bad-txt:  #B71C1C;  --bad-bg:  #FFCDD2;  --bad-bd:  #C62828;

  --n900:#1F2937; --n700:#374151; --n500:#6B7280; --n400:#9CA3AF;
  --n300:#BFBFBF; --n200:#E5E7EB; --n100:#F3F4F6; --n50:#F9FAFB;

  /* --- Interfaz (referencia: capturas _Modelo Pagina web) --- */
  --ui-bg:      #FFFFFF;
  --ui-canvas:  #FCFCFD;
  --ui-line:    #EAEAEF;
  --ui-line-2:  #F1F1F5;
  --ui-primary: #1B5EA8;
  --ui-primary-h:#164E8C;
  --ui-radius:  10px;
  --ui-radius-lg:14px;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;

  /* Tokens de interfaz que cambian con el tema. Los --mak-* de arriba NO:
     son la identidad del reporte impreso y deben ser idénticos en ambos temas. */
  --ui-bg-blur: rgba(255,255,255,.9);
  --focus-ring: #F3F7FC;
  --focus-line: #DCE9F7;
  --hover-tint: #F3F7FC;
  --note-bg:    #F3F7FC;
  --note-warn:  #FFFBF0;
  --note-bad:   #FFF5F5;
  --toast-bg:   #1F2937;
  --toast-fg:   #FFFFFF;
  --toast-bad:  #B71C1C;
  --ok-bd-soft: #A5D6A7;
  --wn-bd-soft: #F0C24B;
  --bd-bd-soft: #EF9A9A;
  --paper-mat:  transparent;
}

/* --- Tema oscuro. Neutros con sesgo hacia el azul corporativo, no grises
       puros, para que el conjunto se lea elegido y no heredado. ----------- */
@media (prefers-color-scheme: dark){
  :root{
    --ui-bg:#151D26; --ui-canvas:#0E141B; --ui-line:#24303D; --ui-line-2:#1C2631;
    --ui-primary:#4A8FD4; --ui-primary-h:#63A2E0;
    --n900:#E8EDF3; --n700:#C2CCD8; --n500:#8B98A8; --n400:#6C7A8A;
    --n300:#4A5765; --n200:#2A3642; --n100:#1E2833; --n50:#1A232D;
    --ok-txt:#8FD79A; --ok-bg:#16321C; --ok-bd:#2E7D32;
    --warn-txt:#EFC65C; --warn-bg:#372B08; --warn-bd:#BF8F00;
    --bad-txt:#F2A0A0; --bad-bg:#3A1719; --bad-bd:#C62828;
    --ui-bg-blur:rgba(21,29,38,.9);
    --focus-ring:#16354F; --focus-line:#2C4966; --hover-tint:#18242F;
    --note-bg:#141F2B; --note-warn:#221B08; --note-bad:#2A1416;
    --toast-bg:#E8EDF3; --toast-fg:#0E141B; --toast-bad:#C62828;
    --ok-bd-soft:#2E7D32; --wn-bd-soft:#8A6A10; --bd-bd-soft:#8C3336;
    --paper-mat:#2A3642;
  }
}
:root[data-theme="dark"]{
  --ui-bg:#151D26; --ui-canvas:#0E141B; --ui-line:#24303D; --ui-line-2:#1C2631;
  --ui-primary:#4A8FD4; --ui-primary-h:#63A2E0;
  --n900:#E8EDF3; --n700:#C2CCD8; --n500:#8B98A8; --n400:#6C7A8A;
  --n300:#4A5765; --n200:#2A3642; --n100:#1E2833; --n50:#1A232D;
  --ok-txt:#8FD79A; --ok-bg:#16321C; --ok-bd:#2E7D32;
  --warn-txt:#EFC65C; --warn-bg:#372B08; --warn-bd:#BF8F00;
  --bad-txt:#F2A0A0; --bad-bg:#3A1719; --bad-bd:#C62828;
  --ui-bg-blur:rgba(21,29,38,.9);
  --focus-ring:#16354F; --focus-line:#2C4966; --hover-tint:#18242F;
  --note-bg:#141F2B; --note-warn:#221B08; --note-bad:#2A1416;
  --toast-bg:#E8EDF3; --toast-fg:#0E141B; --toast-bad:#C62828;
  --ok-bd-soft:#2E7D32; --wn-bd-soft:#8A6A10; --bd-bd-soft:#8C3336;
  --paper-mat:#2A3642;
}
:root[data-theme="light"]{
  --ui-bg:#FFFFFF; --ui-canvas:#FCFCFD; --ui-line:#EAEAEF; --ui-line-2:#F1F1F5;
  --ui-primary:#1B5EA8; --ui-primary-h:#164E8C;
  --n900:#1F2937; --n700:#374151; --n500:#6B7280; --n400:#9CA3AF;
  --n300:#BFBFBF; --n200:#E5E7EB; --n100:#F3F4F6; --n50:#F9FAFB;
  --ok-txt:#1B5E20; --ok-bg:#C8E6C9; --ok-bd:#2E7D32;
  --warn-txt:#7A5C00; --warn-bg:#FFE082; --warn-bd:#BF8F00;
  --bad-txt:#B71C1C; --bad-bg:#FFCDD2; --bad-bd:#C62828;
  --ui-bg-blur:rgba(255,255,255,.9);
  --focus-ring:#F3F7FC; --focus-line:#DCE9F7; --hover-tint:#F3F7FC;
  --note-bg:#F3F7FC; --note-warn:#FFFBF0; --note-bad:#FFF5F5;
  --toast-bg:#1F2937; --toast-fg:#FFFFFF; --toast-bad:#B71C1C;
  --ok-bd-soft:#A5D6A7; --wn-bd-soft:#F0C24B; --bd-bd-soft:#EF9A9A;
  --paper-mat:transparent;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--ui-canvas); color:var(--n900);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--ui-primary); }

/* ---------------------------------------------------------------- layout -- */
#app{ display:grid; grid-template-columns:300px 1fr; min-height:100vh; }

/* ---------------------------------------------------------------- sidebar - */
#side{
  background:var(--ui-bg); border-right:1px solid var(--ui-line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{ padding:18px 18px 14px; border-bottom:1px solid var(--ui-line-2); }
.brand-row{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:30px; height:30px; border-radius:8px; flex:none;
  background:linear-gradient(135deg,var(--mak-azul) 0%,var(--mak-azul-osc) 60%,var(--mak-oro) 160%);
  display:grid; place-items:center; color:#fff; font-weight:800; font-size:13px; letter-spacing:-.5px;
}
.brand-name{ font-weight:700; font-size:15px; letter-spacing:-.2px; }
.brand-sub{ font-size:11.5px; color:var(--n500); margin-top:1px; }

.proj{ padding:12px 14px 4px; }
.proj label{ font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--n400); text-transform:uppercase; }
.proj input{
  width:100%; margin-top:5px; padding:8px 10px; border:1px solid var(--ui-line);
  border-radius:8px; background:var(--ui-bg); font-size:13px;
}
.proj input:focus{ outline:2px solid var(--focus-line); border-color:var(--ui-primary); }
.proj select{
  width:100%; margin-top:5px; padding:8px 10px; border:1px solid var(--ui-line);
  border-radius:8px; background:var(--ui-bg); font-size:13px;
}
.proj select:focus{ outline:2px solid var(--focus-line); border-color:var(--ui-primary); }
.tema-nota{ font-size:10.5px; color:var(--n400); margin-top:5px; line-height:1.4; }

.side-scroll{ flex:1; overflow-y:auto; padding:10px 10px 16px; }
.nav-group{ margin-top:14px; }
.nav-title{
  font-size:10.5px; font-weight:700; letter-spacing:.07em; color:var(--n400);
  text-transform:uppercase; padding:0 10px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border:0; background:transparent; border-radius:8px;
  cursor:pointer; color:var(--n700); font-size:13.5px;
}
.nav-item:hover{ background:var(--n50); }
.nav-item[aria-current="true"]{ background:var(--n100); color:var(--n900); font-weight:600; }
.nav-ico{ width:20px; text-align:center; font-size:14px; flex:none; opacity:.85; }
.nav-badge{
  margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:99px;
  border:1px solid transparent;
}
.nav-badge.ok  { color:var(--ok-txt);   background:var(--ok-bg);   border-color:var(--ok-bd-soft); }
.nav-badge.warn{ color:var(--warn-txt); background:var(--warn-bg); border-color:var(--wn-bd-soft); }
.nav-badge.bad { color:var(--bad-txt);  background:var(--bad-bg);  border-color:var(--bd-bd-soft); }
.nav-badge.mute{ color:var(--n500);     background:var(--n100);    border-color:var(--ui-line); }

.side-foot{ border-top:1px solid var(--ui-line-2); padding:12px 14px; display:flex; gap:8px; flex-wrap:wrap; }

/* ---------------------------------------------------------------- buttons - */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:8px 14px; border-radius:99px; border:1px solid var(--ui-line);
  background:var(--ui-bg); cursor:pointer; font-size:13px; font-weight:600;
  color:var(--n700); white-space:nowrap;
}
.btn:hover{ background:var(--n50); }
.btn.primary{ background:var(--ui-primary); border-color:var(--ui-primary); color:#fff; }
.btn.primary:hover{ background:var(--ui-primary-h); }
.btn.sm{ padding:5px 11px; font-size:12px; }
.btn.wide{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------------------------------------------------------------- main ---- */
#main{ min-width:0; display:flex; flex-direction:column; }
.topbar{
  position:sticky; top:0; z-index:20; background:var(--ui-bg-blur);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--ui-line);
  padding:12px 26px; display:flex; align-items:center; gap:12px;
}
.crumb{ font-size:13px; color:var(--n500); display:flex; align-items:center; gap:8px; min-width:0; }
.crumb b{ color:var(--n900); font-weight:600; }
.crumb .sep{ color:var(--n300); }
.topbar-actions{ margin-left:auto; display:flex; gap:8px; }

.view{ padding:24px 26px 80px; max-width:1500px; width:100%; }
.view[hidden]{ display:none; }
.view-head{ margin-bottom:18px; }
.view-head h1{ margin:0; font-size:23px; font-weight:700; letter-spacing:-.4px; }
.view-head p{ margin:6px 0 0; color:var(--n500); font-size:13.5px; max-width:78ch; }

.cols{ display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:18px; align-items:start; }
@media (max-width:1180px){ .cols{ grid-template-columns:minmax(0,1fr); } }

/* ---------------------------------------------------------------- cards --- */
.card{
  background:var(--ui-bg); border:1px solid var(--ui-line);
  border-radius:var(--ui-radius-lg); margin-bottom:18px; overflow:hidden;
}
.card-head{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  border-bottom:1px solid var(--ui-line-2);
}
.card-head h2{ margin:0; font-size:14.5px; font-weight:650; letter-spacing:-.15px; }
.card-head .hint{ font-size:12px; color:var(--n500); font-weight:400; }
.card-actions{ margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
.card-body{ padding:16px; }
.card-body.tight{ padding:10px; }
.card.rail .card-body{ padding:14px; }

/* ---------------------------------------------------------------- tabs ---- */
.tabs{ display:flex; gap:4px; padding:8px 10px 0; border-bottom:1px solid var(--ui-line-2); }
.tab{
  border:0; background:transparent; padding:8px 12px 10px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--n500); border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{ color:var(--ui-primary); border-bottom-color:var(--ui-primary); }
.tabpane[hidden]{ display:none; }

/* ------------------------------------------------------------ data grid --- */
.gridwrap{ overflow-x:auto; }
table.grid{ border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; }
table.grid th{
  position:sticky; top:0; background:var(--n50); text-align:left; font-weight:650;
  font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--n500);
  padding:8px 8px; border-bottom:1px solid var(--ui-line); white-space:nowrap;
}
table.grid td{ padding:3px 4px; border-bottom:1px solid var(--ui-line-2); }
table.grid tr:hover td{ background:var(--n50); }
table.grid input, table.grid select{
  width:100%; min-width:72px; padding:5px 7px; border:1px solid transparent;
  border-radius:6px; background:transparent; font-size:12.5px; font-variant-numeric:tabular-nums;
}
table.grid input:hover, table.grid select:hover{ border-color:var(--ui-line); }
table.grid input:focus, table.grid select:focus{
  outline:none; border-color:var(--ui-primary); background:var(--ui-bg);
  box-shadow:0 0 0 3px var(--focus-ring);
}
table.grid input.num{ text-align:right; }
table.grid input.wide{ min-width:120px; }
td.rowdel{ width:34px; }
.iconbtn{
  border:0; background:transparent; cursor:pointer; color:var(--n400);
  padding:4px 6px; border-radius:6px; font-size:13px;
}
.iconbtn:hover{ background:var(--bad-bg); color:var(--bad-txt); }
.grid-foot{ display:flex; gap:8px; align-items:center; padding:10px 4px 0; flex-wrap:wrap; }

/* ------------------------------------------------------------- rail form -- */
.field{ margin-bottom:13px; }
.field:last-child{ margin-bottom:0; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--n700); margin-bottom:5px; }
.field .desc{ font-size:11.5px; color:var(--n500); margin-top:5px; line-height:1.45; }
.field select, .field input[type=number], .field input[type=text]{
  width:100%; padding:7px 9px; border:1px solid var(--ui-line); border-radius:8px;
  background:var(--ui-bg); font-size:13px;
}
.field select:focus, .field input:focus{ outline:none; border-color:var(--ui-primary); box-shadow:0 0 0 3px var(--focus-ring); }
.inline2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* Deslizador + lectura del valor, en una sola línea */
.slider{ display:flex; align-items:center; gap:10px; }
.slider input[type=range]{ flex:1; min-width:0; accent-color:var(--ui-primary); }
.slider .eco{
  min-width:62px; text-align:right; font-size:12.5px; font-weight:650;
  color:var(--n900); font-variant-numeric:tabular-nums;
}
.chk{ display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--n700); }
.chk input{ margin-top:3px; }

/* ---------------------------------------------------------------- kpis ---- */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--ui-line-2); }
.kpi{ background:var(--ui-bg); padding:14px 16px; }
.kpi .k{ font-size:11px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--n500); }
.kpi .v{ font-size:24px; font-weight:700; letter-spacing:-.6px; margin-top:3px; font-variant-numeric:tabular-nums; }
.kpi .u{ font-size:12px; color:var(--n500); font-weight:500; margin-left:3px; }
.kpi.ok   .v{ color:var(--ok-txt); }
.kpi.warn .v{ color:var(--warn-txt); }
.kpi.bad  .v{ color:var(--bad-txt); }

/* -------------------------------------------------------------- notices --- */
.note{
  border:1px solid var(--ui-line); border-left:3px solid var(--ui-primary);
  background:var(--note-bg); border-radius:8px; padding:10px 13px;
  font-size:12.5px; color:var(--n700); line-height:1.5;
}
.note.warn{ border-left-color:var(--mak-oro); background:var(--note-warn); }
.note.bad{ border-left-color:var(--bad-bd); background:var(--note-bad); }
.note + .note{ margin-top:8px; }
.note b{ color:var(--n900); }

.dropzone{
  border:1.5px dashed var(--ui-line); border-radius:var(--ui-radius);
  padding:26px 20px; text-align:center; color:var(--n500); font-size:13px;
  background:var(--n50); cursor:pointer;
}
.dropzone:hover, .dropzone.over{ border-color:var(--ui-primary); background:var(--hover-tint); color:var(--ui-primary); }
.dropzone b{ color:var(--n900); }

/* --------------------------------------------------------- svg viewport ---
   El lienzo del reporte es papel: blanco en ambos temas, porque es exactamente
   lo que se exporta a Word y a PowerPoint. En oscuro recibe un marco de paspartú
   para que la hoja no deslumbre contra el fondo. */
.svgbox{ overflow-x:auto; background:#FFFFFF; border:1px solid var(--paper-mat); border-radius:6px; }
.svgbox > svg{ display:block; width:100%; height:auto; min-width:680px; }
.exportable{ position:relative; }

.pill{
  display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px;
  border-radius:99px; border:1px solid;
}
.pill.ok  { color:var(--ok-txt);   background:var(--ok-bg);   border-color:var(--ok-bd-soft); }
.pill.warn{ color:var(--warn-txt); background:var(--warn-bg); border-color:var(--wn-bd-soft); }
.pill.bad { color:var(--bad-txt);  background:var(--bad-bg);  border-color:var(--bd-bd-soft); }
.pill.mute{ color:var(--n500);     background:var(--n100);    border-color:var(--ui-line); }

/* ---------------------------------------------------------------- toast --- */
#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg); color:var(--toast-fg); padding:10px 18px; border-radius:99px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.22s; z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,.18); max-width:90vw; text-align:center;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.bad{ background:var(--toast-bad); color:#FFFFFF; }

/* ---------------------------------------------------------------- modal --- */
.modal[hidden]{ display:none; }
.modal{
  position:fixed; inset:0; z-index:90; background:rgba(17,24,39,.45);
  display:grid; place-items:center; padding:24px;
}
.modal-panel{
  background:var(--ui-bg); border-radius:var(--ui-radius-lg); width:min(940px,100%);
  max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-head{ padding:16px 20px; border-bottom:1px solid var(--ui-line-2); display:flex; align-items:center; gap:12px; }
.modal-head h2{ margin:0; font-size:16px; font-weight:650; }
.modal-body{ padding:18px 20px; overflow:auto; }
.modal-foot{ padding:14px 20px; border-top:1px solid var(--ui-line-2); display:flex; gap:8px; justify-content:flex-end; }

/* ---------------------------------------------------------------- tests --- */
#testview pre{
  font-family:var(--mono); font-size:12px; line-height:1.55; margin:0;
  white-space:pre-wrap; word-break:break-word;
}
.t-pass{ color:var(--ok-txt); }
.t-fail{ color:var(--bad-txt); font-weight:700; }
</style>

<div id="app">

  <!-- ====================================================== SIDEBAR ====== -->
  <aside id="side">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark">M</div>
        <div style="min-width:0">
          <div class="brand-name">MAKYL</div>
          <div class="brand-sub">Control Topográfico Estructural</div>
        </div>
      </div>
    </div>

    <div class="proj">
      <label for="projName">Proyecto</label>
      <input id="projName" type="text" placeholder="Nombre del proyecto">
      <div style="height:8px"></div>
      <label for="projSub">Ubicación / alcance</label>
      <input id="projSub" type="text" placeholder="Ej. Bahías 22 y 23, Truck Shop">
      <div style="height:8px"></div>
      <label for="selTema">Tema del reporte</label>
      <select id="selTema" data-par="reporte.tema"></select>
      <div class="tema-nota" id="temaNota"></div>
    </div>

    <div class="side-scroll">
      <div class="nav-group">
        <div class="nav-title">Módulos</div>
        <button class="nav-item" data-view="nivelacion">
          <span class="nav-ico">▤</span><span>Nivelación de placas</span>
          <span class="nav-badge mute" id="badge-niv">—</span>
        </button>
        <button class="nav-item" data-view="verticalidad">
          <span class="nav-ico">↕</span><span>Verticalidad</span>
          <span class="nav-badge mute" id="badge-ver">—</span>
        </button>

<script>
/* ============================================================================
 * CORE — Motor de cálculo
 * ----------------------------------------------------------------------------
 * Réplica literal de las fórmulas del libro
 *   _Entregables\5. Informe\_Excel\Nivelacion_y_Verticalidad_MAKYL_Rev2 .xlsx
 * La referencia de celda de cada fórmula va anotada al lado. Ese libro es la
 * fuente de verdad: si algo aquí discrepa, gana el Excel.
 *
 * Este bloque es PURO — no toca el DOM. Es lo que valida el panel "Validación
 * vs. Excel", que compara contra los valores calculados reales del libro.
 * ========================================================================= */
'use strict';

const CUMPLE = 'CUMPLE';
const CERCA  = 'CUMPLE (cerca del límite)';
const NOCUM  = 'NO CUMPLE';

/* -- Excel redondea los medios ALEJÁNDOSE de cero; Math.round de JS los manda
      siempre hacia +∞ (Math.round(-2.5) === -2, mientras ROUND(-2.5,0) = -3).
      Afecta a la dirección de brújula en los múltiplos exactos de 22.5°. ----- */
function excelRound(x, digits){
  const f = Math.pow(10, digits || 0);
  const v = x * f;
  const r = v < 0 ? -Math.round(-v) : Math.round(v);
  return r / f;
}

/* -- MOD de Excel devuelve siempre el signo del divisor (positivo aquí) ----- */
function excelMod(a, b){ return a - b * Math.floor(a / b); }

const DIRECCIONES = ['↑ N','↗ NE','→ E','↘ SE','↓ S','↙ SO','← O','↖ NO'];

/* Verticalidad Columnas!I9
 *   =IF(F9<0.5,"—",CHOOSE(1+MOD(ROUND(MOD(DEGREES(ATAN2(E9,D9)),360)/45,0),8), ...))
 * OJO: ATAN2 de Excel recibe (x, y) en ese orden, así que ATAN2(ΔN, ΔE)
 * equivale a Math.atan2(ΔE, ΔN) en JS — es el AZIMUT, horario desde el Norte.
 */
function direccionBrujula(dE, dN, desvTotal){
  if (desvTotal < 0.5) return '—';
  const deg  = Math.atan2(dE, dN) * 180 / Math.PI;
  const norm = excelMod(deg, 360);
  const idx  = excelMod(excelRound(norm / 45, 0), 8);
  return DIRECCIONES[idx];
}

/* Semáforo compartido por los tres módulos:
 *   =IF(v<=tol*k,"CUMPLE",IF(v<=tol,"CUMPLE (cerca del límite)","NO CUMPLE"))
 * con k = 0.8 en el libro (umbral ámbar). Se compara siempre en valor absoluto.
 */
function evaluar(valor, tol, k){
  const a = Math.abs(valor);
  if (a <= tol * k) return CUMPLE;
  if (a <= tol)     return CERCA;
  return NOCUM;
}
function claseEval(e){ return e === CUMPLE ? 'ok' : e === CERCA ? 'warn' : 'bad'; }

/* ---------------------------------------------------------------------------
 * Orden correlativo de ejes
 * ---------------------------------------------------------------------------
 * «4.4-F» ordena por su número de eje X ascendente y su letra de eje Y
 * DESCENDENTE, que es como se recorre un plano: de izquierda a derecha y de
 * arriba abajo (F es la fila superior). Con ese criterio la salida sale
 * correlativa aunque los datos se hayan introducido en cualquier orden — y
 * reproduce el orden que ya trae el Excel en Nivelación.
 * ------------------------------------------------------------------------- */
function partesEje(s){
  const m = String(s == null ? '' : s).match(/^\s*(\d+(?:[.,]\d+)?)\s*[-–]\s*([A-Za-z]+)\s*$/);
  return m ? [parseFloat(m[1].replace(',','.')), m[2].toUpperCase()]
           : [Number.POSITIVE_INFINITY, String(s == null ? '' : s).toUpperCase()];
}
function ordenEje(a, b){
  const [na, la] = partesEje(a), [nb, lb] = partesEje(b);
  if (na !== nb) return na - nb;
  return la < lb ? 1 : la > lb ? -1 : 0;      // letra descendente: F, E, … A
}

/* Conteo del pie de tabla:
 *   =COUNTIF(rango,"CUMPLE")+COUNTIF(rango,"CUMPLE (cerca del límite)")
 *      & " / " & COUNTA(rango)                       (G29 / F31 / E18)
 * Es decir: "cerca del límite" CUENTA como cumplimiento.
 */
function conteoCumplen(evaluaciones){
  const n = evaluaciones.filter(e => e === CUMPLE || e === CERCA).length;
  return { n, total: evaluaciones.length, texto: n + ' / ' + evaluaciones.length };
}

/* ---------------------------------------------------------------------------
 * Catálogo de límites de deflexión
 * ---------------------------------------------------------------------------
 * NOTA TÉCNICA: ANSI/AISC 360-16 Capítulo L (Diseño para Estados Límite de
 * Servicio) NO publica una tabla de límites numéricos — remite explícitamente
 * a los criterios de servicio que fije el proyecto. Los divisores de uso
 * corriente provienen de IBC Tabla 1604.3 y de las guías de diseño AISC.
 * Cada opción lleva su fuente real; ninguna se atribuye a 360-16 en falso.
 * ------------------------------------------------------------------------- */
const CATALOGO_DEFLEXION = [
  { div:500, etiqueta:'L/500',  grupo:'Criterio del informe',
    desc:'Criterio adoptado en el informe MAKYL Rev2 (Eje Cumbrera). Reproduce el Excel de referencia.' },

  { div:120, etiqueta:'L/120',  grupo:'IBC Tabla 1604.3 — Techos',
    desc:'Techo sin cielo raso — carga total (D+L).' },
  { div:180, etiqueta:'L/180',  grupo:'IBC Tabla 1604.3 — Techos',
    desc:'Techo sin cielo raso — carga viva / nieve / viento.' },
  { div:240, etiqueta:'L/240',  grupo:'IBC Tabla 1604.3 — Techos',
    desc:'Techo con cielo raso no frágil — carga viva; o con cielo raso frágil, carga total.' },
  { div:360, etiqueta:'L/360',  grupo:'IBC Tabla 1604.3 — Techos y pisos',
    desc:'Techo con cielo raso frágil (yeso) — carga viva; y pisos — carga viva.' },

  { div:240, etiqueta:'L/240',  grupo:'AISC Design Guide 3 — Servicio',
    desc:'Vigas de techo, criterio de servicio recomendado.' },
  { div:360, etiqueta:'L/360',  grupo:'AISC Design Guide 3 — Servicio',
    desc:'Vigas de piso, criterio de servicio recomendado.' },

  { div:400, etiqueta:'L/400',  grupo:'AISC Design Guide 7 — Viga carrilera',
    desc:'Deflexión LATERAL de viga carrilera de puente grúa.' },
  { div:600, etiqueta:'L/600',  grupo:'AISC Design Guide 7 — Viga carrilera',
    desc:'Deflexión VERTICAL, puentes grúa clase CMAA A, B y C.' },
  { div:800, etiqueta:'L/800',  grupo:'AISC Design Guide 7 — Viga carrilera',
    desc:'Deflexión VERTICAL, puentes grúa clase CMAA D, E y F (servicio pesado).' },

  { div:1000,etiqueta:'L/1000', grupo:'Equipamiento sensible',
    desc:'Criterio estricto para maquinaria o rieles de alta precisión. Verificar con el fabricante.' }
];

/* ===========================================================================
 * MÓDULO 1 — Nivelación de Placas Base           (hoja "Nivelacion Placas Base")
 * ---------------------------------------------------------------------------
 * Entrada por placa: eje + 4 desviaciones en mm (NO, NE, SO, SE).
 * Norma: ANSI/AISC 303 §7.5.1(c) — variación en elevación ≤ ±1/2 in [±12.7 mm]
 * ========================================================================= */
function calcNivelacion(placas, params){
  const tol = num(params.tolMm, 12.7);
  const k   = num(params.umbral, 0.8);

  const filas = placas.map(p => {
    const esquinas = [num(p.no,0), num(p.ne,0), num(p.so,0), num(p.se,0)];
    // G7: =MAX(ABS(C7),ABS(D7),ABS(E7),ABS(F7))
    const desvMax = Math.max.apply(null, esquinas.map(Math.abs));
    // I7: semáforo AISC 303
    const evaluacion = evaluar(desvMax, tol, k);
    return {
      eje: p.eje || '', esquinas, desvMax, tol, evaluacion,
      pct: tol === 0 ? 0 : desvMax / tol,
      // Formato condicional C7:F26 → =ABS(C7)>$H7
      excede: esquinas.map(v => Math.abs(v) > tol),
      origen: p.origen || 'medido',
      nota: p.nota || ''
    };
  });

  filas.sort((a,b) => ordenEje(a.eje, b.eje));   // salida siempre correlativa

  // G28: =AVERAGE(G7:G26)
  const promedio = filas.length
    ? filas.reduce((s,f) => s + f.desvMax, 0) / filas.length
    : 0;
  const conteo = conteoCumplen(filas.map(f => f.evaluacion));
  const peor   = filas.reduce((a,f) => (a && a.desvMax >= f.desvMax) ? a : f, null);

  return {
    filas, promedio, conteo, tol, umbral: k,
    peor,
    maximo: peor ? peor.desvMax : 0,
    global: filas.length ? evaluar(peor.desvMax, tol, k) : null,
    norma: 'ANSI/AISC 303 §7.5.1(c)'
  };
}

/* ===========================================================================
 * MÓDULO 2 — Verticalidad de Columnas             (hoja "Verticalidad Columnas")
 * ---------------------------------------------------------------------------
 * Entrada por columna: eje + punto superior (E,N,Z) + punto base (E,N,Z).
 * Tolerancia de aplome H/500 (AISC 303 §7.13.1.1).
 *
 * ALTURA DE DISEÑO: los comentarios O9:O28 del libro documentan que la Z
 * superior fue sustituida por  Z_base + altura nominal del eje,  porque el
 * punto medido en campo era la viga carrilera y no el tope real de la columna.
 * Se conserva `zSupMedido` para trazabilidad y la fila queda marcada AJUSTADA.
 * ========================================================================= */
function calcVerticalidad(columnas, params){
  const divisor = num(params.divisor, 500);
  const k       = num(params.umbral, 0.8);

  const filas = columnas.map(c => {
    const zBase = num(c.zBase, 0);
    /* zSup es SIEMPRE el valor efectivo almacenado, nunca uno recalculado.
       Aplicar una altura de diseño (zBase + h/1000) en cada cálculo metería
       error de coma flotante y H dejaría de dar el entero exacto del libro.
       La acción "aplicar altura de diseño" escribe zSup una sola vez, al
       editar, y deja zSupMedido/hNominalMm como rastro de auditoría. */
    const zSup = num(c.zSup, 0);

    const dE = (num(c.eSup,0) - num(c.eBase,0)) * 1000;   // D9
    const dN = (num(c.nSup,0) - num(c.nBase,0)) * 1000;   // E9
    const desvTotal = Math.sqrt(dE*dE + dN*dN);           // F9
    const alturaH   = (zSup - zBase) * 1000;              // G9
    const tol       = alturaH / divisor;                  // H9
    const direccion = direccionBrujula(dE, dN, desvTotal);// I9
    const evaluacion= evaluar(desvTotal, tol, k);         // J9

    return {
      eje: c.eje || '', dE, dN, desvTotal, alturaH, tol, direccion, evaluacion,
      // U9/V9: coordenadas del gráfico polar, en % de la tolerancia
      uE: tol === 0 ? 0 : dE / tol * 100,
      uN: tol === 0 ? 0 : dN / tol * 100,
      pct: tol === 0 ? 0 : desvTotal / tol,
      // Fila AJUSTADA: la Z superior no es la medida en campo (ver O9:O28)
      ajustada: (c.zSupMedido != null && c.zSupMedido !== '')
             || (c.hNominalMm != null && c.hNominalMm !== ''),
      hNominalMm: (c.hNominalMm != null && c.hNominalMm !== '') ? num(c.hNominalMm,0) : null,
      zSupMedido: (c.zSupMedido != null && c.zSupMedido !== '') ? num(c.zSupMedido,0) : null,
      origen: c.origen || 'medido',
      nota: c.nota || '',
      eSup:num(c.eSup,0), nSup:num(c.nSup,0), zSup,
      eBase:num(c.eBase,0), nBase:num(c.nBase,0), zBase
    };
  });

  filas.sort((a,b) => ordenEje(a.eje, b.eje));   // salida siempre correlativa

  // F30: =MAX(F9:F28)
  const maximo = filas.length ? Math.max.apply(null, filas.map(f => f.desvTotal)) : 0;
  const conteo = conteoCumplen(filas.map(f => f.evaluacion));
  const peor   = filas.reduce((a,f) => (a && a.desvTotal >= f.desvTotal) ? a : f, null);

  return {
    filas, maximo, conteo, divisor, umbral:k, peor,
    global: peor ? peor.evaluacion : null,
    nEstimadas: filas.filter(f => f.origen === 'estimado').length,
    nAjustadas: filas.filter(f => f.ajustada).length,
    norma: 'AISC 303 §7.13.1.1 — H/' + divisor
  };
}

/* ===========================================================================
 * MÓDULO 2b — Plano de Ejes en planta                   (hoja "Plano de Ejes")
 * ---------------------------------------------------------------------------
 * Vista paramétrica que consume el módulo de Verticalidad por nombre de eje
 * ("ejeX-ejeY"), igual que el INDEX/MATCH de AD8/AE8.
 * ========================================================================= */
const FLECHA_MIN_MM   = 350;   // M6 — longitud mínima de flecha
const FLECHA_UMBRAL   = 0.3;   // por debajo de 0.3 mm no se dibuja flecha
const FLECHA_OBJETIVO = 2000;  // D6 — la flecha mayor mide ~2 m

function calcPlanoEjes(ejesX, ejesY, columnas, verticalidad, params){
  const minFlecha = num(params && params.flechaMinMm, FLECHA_MIN_MM);
  const porEje = new Map();
  (verticalidad ? verticalidad.filas : []).forEach(f => porEje.set(f.eje, f));

  const xs = new Map(ejesX.map(e => [String(e.nombre), num(e.pos,0)]));
  const ys = new Map(ejesY.map(e => [String(e.nombre), num(e.pos,0)]));

  const puntos = columnas.map(c => {
    const ejeX = String(c.ejeX), ejeY = String(c.ejeY);
    const clave = ejeX + '-' + ejeY;                       // MATCH(Z8&"-"&AA8, …)
    const v = porEje.get(clave);
    return {
      ejeX, ejeY, clave,
      x: xs.has(ejeX) ? xs.get(ejeX) : 0,                  // AB8 (IFERROR→0)
      y: ys.has(ejeY) ? ys.get(ejeY) : 0,                  // AC8
      dE: v ? v.dE : 0,                                    // AD8
      dN: v ? v.dN : 0,                                    // AE8
      evaluacion: v ? v.evaluacion : null,
      medida: !!v
    };
  });

  // D6: =ROUND(2000/MAX(MAX(dE),-MIN(dE),MAX(dN),-MIN(dN),1),0)
  const dEs = puntos.map(p => p.dE), dNs = puntos.map(p => p.dN);
  const extremo = Math.max(
    dEs.length ? Math.max.apply(null,dEs) : 0, dEs.length ? -Math.min.apply(null,dEs) : 0,
    dNs.length ? Math.max.apply(null,dNs) : 0, dNs.length ? -Math.min.apply(null,dNs) : 0,
    1
  );
  const escala = excelRound(FLECHA_OBJETIVO / extremo, 0);

  // AP9 / AS9: X + IF(|Δ|<0.3, 0, SIGN(Δ)*MAX(|Δ*escala|, minFlecha))
  const largo = d => Math.abs(d) < FLECHA_UMBRAL
    ? 0
    : Math.sign(d) * Math.max(Math.abs(d * escala), minFlecha);

  puntos.forEach(p => {
    p.flechaE = largo(p.dE);
    p.flechaN = largo(p.dN);
    // AV8: =IF(AND(|dE|<0.3,|dN|<0.3),"",TEXT(SQRT(dE²+dN²),"0.0")&" mm")
    p.etiqueta = (Math.abs(p.dE) < FLECHA_UMBRAL && Math.abs(p.dN) < FLECHA_UMBRAL)
      ? ''
      : fmt(Math.sqrt(p.dE*p.dE + p.dN*p.dN), 1) + ' mm';
  });

  return { puntos, escala, extremo, minFlecha,
           ejesX: ejesX.map(e => ({nombre:String(e.nombre), pos:num(e.pos,0)})),
           ejesY: ejesY.map(e => ({nombre:String(e.nombre), pos:num(e.pos,0)})) };
}

/* ===========================================================================
 * MÓDULO 3 — Deflexión de Vigas / Cerchas             (hoja "Deflexion Vigas")
 * ---------------------------------------------------------------------------
 * Entrada PENZD: puntos a lo largo del eje, cada uno marcado como APOYO o
 * INTERMEDIO. Se admiten más de dos apoyos: la viga se parte en vanos.
 *
 * Dos modos de evaluación, porque la norma admite las dos lecturas y llevan a
 * conclusiones distintas. El modo activo se imprime en tabla y gráfico para
 * que ningún informe quede ambiguo:
 *
 *   'vano'  (por defecto) — tratamiento estructural. Cada vano entre apoyos
 *           consecutivos tiene su propia cuerda teórica y su propia tolerancia
 *           L_vano/divisor. Con dos apoyos equivale exactamente al Excel Rev2.
 *
 *   'tramo' — literal. Una fila por par de lecturas consecutivas; la tolerancia
 *           es la de ESA distancia, mientras que Δz se sigue midiendo contra la
 *           cuerda global. Es mucho más exigente.
 * ========================================================================= */
const ROL_APOYO = 'S';

/* Los proyectos v1 guardaban 'A' (soporte inicial) y 'B' (soporte final).
   Ambos son apoyos; 'I' sigue siendo lectura intermedia. */
function esApoyo(rol){ return rol === ROL_APOYO || rol === 'A' || rol === 'B'; }

/* Un tramo NO SE PUBLICA cuando termina en un apoyo y su flecha es cero: el
   apoyo define la cuerda de referencia, de modo que ese cero es geometría, no
   medición, y listarlo como un tramo que «cumple» infla el resultado.
   La segunda condición no es adorno — en modo 'tramo' la flecha se mide contra
   la cuerda GLOBAL, así que un apoyo intermedio (tres o más apoyos) puede tener
   Δz real distinto de cero, y ése sí es un dato que hay que enseñar. */
function tramoDeApoyo(t){ return t.apoyo && Math.abs(t.dz) < 1e-6; }

function calcDeflexion(puntos, params){
  const divisor = num(params.divisor, 500);
  const k       = num(params.umbral, 0.8);
  const modo    = params.modo === 'tramo' ? 'tramo' : 'vano';

  /* Lecturas coincidentes: dos registros del mismo punto darían un tramo de
     longitud nula, con tolerancia 0 mm y una evaluación NO CUMPLE falsa. Se
     promedian antes de calcular y se informa de cuántas se unieron. */
  const crudos = puntos.filter(p => p && p.pto !== '' && p.pto != null);
  const pts = [], fusionados = [];
  crudos.forEach(p => {
    const prev = pts.find(q =>
      Math.hypot(num(q.e,0) - num(p.e,0), num(q.n,0) - num(p.n,0)) <= 0.001);
    if (!prev){ pts.push(Object.assign({}, p, {__n:1})); return; }
    const n = prev.__n + 1;
    prev.e = (num(prev.e,0)*prev.__n + num(p.e,0)) / n;
    prev.n = (num(prev.n,0)*prev.__n + num(p.n,0)) / n;
    prev.z = (num(prev.z,0)*prev.__n + num(p.z,0)) / n;
    prev.__n = n;
    if (esApoyo(p.rol)) prev.rol = p.rol;              // el rol de apoyo manda
    if (String(prev.pto) !== String(p.pto)) prev.pto = prev.pto + '/' + p.pto;
    fusionados.push(String(p.pto));
  });

  const vacio = {
    puntos:[], tramos:[], tramosVisibles:[], vanos:[], L:0, tol:0, umbralMm:0, umbral:k, divisor, modo,
    dzMax:0, xMax:0, ptoMax:'', conteo:{n:0,total:0,texto:'0 / 0'},
    conteoVisible:{n:0,total:0,texto:'0 / 0'},
    global:null, soporteA:'', soporteB:'', fusionados,
    error:'Se necesitan al menos dos puntos marcados como Apoyo.'
  };

  const iApoyos = pts.reduce((a,p,i) => (esApoyo(p.rol) ? a.concat(i) : a), []);
  if (iApoyos.length < 2) return vacio;

  /* Los extremos del elemento son los dos apoyos MÁS SEPARADOS, no el primero
     y el último que se teclearon, y el eje se orienta siempre de oeste a este
     (desempate por norte). Sin esa regla, introducir los puntos en otro orden
     invertía la viga y la tabla salía del revés. */
  let ia = iApoyos[0], ib = iApoyos[1], dmax = -1;
  for (let i = 0; i < iApoyos.length; i++)
    for (let j = i + 1; j < iApoyos.length; j++){
      const p = pts[iApoyos[i]], q = pts[iApoyos[j]];
      const d = Math.hypot(num(q.e,0) - num(p.e,0), num(q.n,0) - num(p.n,0));
      if (d > dmax){ dmax = d; ia = iApoyos[i]; ib = iApoyos[j]; }
    }
  if (num(pts[ia].e,0) > num(pts[ib].e,0) ||
     (num(pts[ia].e,0) === num(pts[ib].e,0) && num(pts[ia].n,0) > num(pts[ib].n,0))){
    const t = ia; ia = ib; ib = t;
  }
  const A = pts[ia], B = pts[ib];
  const dE = num(B.e,0) - num(A.e,0);                 // V9
  const dN = num(B.n,0) - num(A.n,0);                 // V10
  const den = dE*dE + dN*dN;
  if (den === 0) return Object.assign({}, vacio, {error:'El primer y el último apoyo tienen las mismas coordenadas E/N.'});

  const L        = Math.sqrt(den);                     // V11
  const tol      = L * 1000 / divisor;                 // V12 — tolerancia del vano completo
  const umbralMm = tol * k;                            // V13

  /* Proyección de cada punto sobre el eje global A→B. La abscisa X y la cuerda
     global son siempre las mismas; lo que cambia entre modos es contra qué
     cuerda se mide Δz y con qué tolerancia se compara. */
  const filas = pts.map((p,i) => {
    // Y9: =((E−E_A)*dE + (N−N_A)*dN) / (dE²+dN²)   — proyección paramétrica
    const t  = ((num(p.e,0) - num(A.e,0))*dE + (num(p.n,0) - num(A.n,0))*dN) / den;
    const x  = t * L;                                          // Z9
    const zc = num(A.z,0) + t * (num(B.z,0) - num(A.z,0));     // AA9
    const dz = (num(p.z,0) - zc) * 1000;                       // AB9
    return {
      idx: i, pto: p.pto, e:num(p.e,0), n:num(p.n,0), z:num(p.z,0),
      desc: p.desc || '', rol: esApoyo(p.rol) ? ROL_APOYO : 'I',
      t, x, zCuerda: zc, dz,
      tol, pct: tol === 0 ? 0 : Math.abs(dz)/tol,               // I9
      evaluacion: evaluar(dz, tol, k)                           // J9
    };
  });

  /* Las lecturas se ordenan por su POSICIÓN sobre la viga, no por el orden en
     que se teclearon: añadir un punto intermedio al final de la tabla creaba
     un tramo «Eje 7 — Eje 2» de 29.975 m que no existe en la realidad. */
  filas.sort((a,b) => a.x - b.x);
  const iApoyosOrd = filas.reduce((a,f,i) => (f.rol === ROL_APOYO ? a.concat(i) : a), []);

  /* --- Vanos entre apoyos consecutivos ----------------------------------
     El vano fija la tolerancia y la cuerda de referencia. Con dos apoyos hay
     un único vano que coincide con el eje global, y todo se reduce al Excel. */
  const vanos = [];
  for (let v = 0; v < iApoyosOrd.length - 1; v++){
    const ini = filas[iApoyosOrd[v]], fin = filas[iApoyosOrd[v+1]];
    const Lv  = Math.abs(fin.x - ini.x);
    vanos.push({
      desde: ini.pto, hasta: fin.pto,
      etiqueta: 'Eje ' + ini.pto + '  —  Eje ' + fin.pto,
      x0: ini.x, x1: fin.x, z0: ini.z, z1: fin.z,
      L: Lv, tol: Lv * 1000 / divisor, umbralMm: Lv * 1000 / divisor * k
    });
  }
  const vanoDe = x => {
    for (let v = 0; v < vanos.length; v++)
      if (x >= Math.min(vanos[v].x0, vanos[v].x1) - 1e-9 &&
          x <= Math.max(vanos[v].x0, vanos[v].x1) + 1e-9) return vanos[v];
    return vanos[vanos.length - 1] || null;
  };

  /* Δz efectiva de cada lectura según el modo:
       vano  → contra la cuerda del vano que la contiene
       tramo → contra la cuerda global (como el Excel), pero comparada luego
               con la tolerancia del tramo, que es mucho menor              */
  filas.forEach(f => {
    const V = vanoDe(f.x);
    if (V && V.x1 !== V.x0){
      const tv = (f.x - V.x0) / (V.x1 - V.x0);
      f.zCuerdaVano = V.z0 + tv * (V.z1 - V.z0);
      f.dzVano = (f.z - f.zCuerdaVano) * 1000;
    } else {
      f.zCuerdaVano = f.zCuerda; f.dzVano = f.dz;
    }
    f.dzEfectivo = modo === 'vano' ? f.dzVano : f.dz;
  });

  /* --- Tramos entre lecturas consecutivas --------------------------------
     La tabla lista tramos en AMBOS modos, igual que el Excel: la fila se
     rotula "Eje i — Eje i+1" pero muestra los valores del punto FINAL
     (C9=M10, E9=Z10, F9=P10, G9=AB10). Lo único que cambia con el modo es
     contra qué tolerancia se juzga cada fila.                              */
  const tramos = [];
  for (let i = 0; i < filas.length - 1; i++){
    const ini = filas[i], fin = filas[i+1];
    /* La longitud del tramo es la DISTANCIA REAL medida entre las dos lecturas,
       no la diferencia de sus proyecciones sobre la cuerda: dos puntos
       separados lateralmente pueden proyectarse en la misma abscisa y daban 0.
       Para lecturas alineadas sobre el eje ambos criterios coinciden. */
    const Lt   = Math.hypot(fin.e - ini.e, fin.n - ini.n);
    const LtMm = Lt * 1000;
    const V    = vanoDe(fin.x);
    const tolT = modo === 'tramo' ? LtMm / divisor : (V ? V.tol : tol);
    const dzT  = fin.dzEfectivo;
    tramos.push({
      punto: fin.pto,
      /* Solo para la presentación: la tabla calla la deflexión de las filas
         cuyo punto final es un apoyo. No interviene en ningún cálculo. */
      apoyo: fin.rol === ROL_APOYO,
      etiqueta: 'Eje ' + ini.pto + '  —  Eje ' + fin.pto,
      desc: fin.desc, L: Lt, Lmm: LtMm, x: fin.x, z: fin.z, dz: dzT,
      vano: V ? V.etiqueta : '',
      tol: tolT,
      pct: tolT === 0 ? 0 : Math.abs(dzT)/tolT,
      evaluacion: evaluar(dzT, tolT, k)
    });
  }

  // E17: =MAX(MAX(AB9:AB14), -MIN(AB9:AB14))  → mayor desviación en absoluto
  const dzsG  = filas.map(f => f.dzEfectivo);
  const dzMax = filas.length ? Math.max(Math.max.apply(null,dzsG), -Math.min.apply(null,dzsG)) : 0;
  const pico  = filas.find(f => Math.abs(f.dzEfectivo) === dzMax) || null;   // H17 / J17

  const unidades = tramos;
  const conteo   = conteoCumplen(unidades.map(u => u.evaluacion));   // E18

  /* Lo que ve el informe: los tramos que terminan en apoyo no se publican, así
     que tampoco se cuentan. `conteo` se conserva intacto —es el valor con el
     que se compara la paridad contra el Excel—; `conteoVisible` es el que sale
     impreso, y sin él la tabla diría «1 / 6» debajo de cinco filas. */
  const tramosVisibles = tramos.filter(t => !tramoDeApoyo(t));
  const conteoVisible  = conteoCumplen(tramosVisibles.map(u => u.evaluacion));
  const peor     = unidades.reduce((a,u) => (a && a.pct >= u.pct) ? a : u, null);
  const estado   = peor ? peor.evaluacion : (filas.length ? CUMPLE : null);

  // E19: evaluación global
  const global = !filas.length ? null
    : estado === CUMPLE ? CUMPLE + ' — deflexión dentro de tolerancia AISC L/' + divisor
    : estado === CERCA  ? CERCA  + ' — revisar en próxima campaña'
    :                     NOCUM  + ' — deflexión excede tolerancia AISC L/' + divisor;

  return {
    puntos: filas, tramos, tramosVisibles, vanos, unidades, modo,
    L, tol, umbralMm, divisor, umbral:k,
    dE, dN, dzMax, xMax: pico ? pico.x : 0, ptoMax: pico ? pico.pto : '',
    conteo, conteoVisible, global, globalClase: claseEval(estado),
    nApoyos: iApoyos.length, fusionados,
    tolMin: tramos.length ? Math.min.apply(null, tramos.map(t => t.tol)) : 0,
    tolMax: tramos.length ? Math.max.apply(null, tramos.map(t => t.tol)) : 0,
    soporteA: A.pto, soporteB: B.pto, error:null
  };
}

const ETIQUETA_MODO = {
  vano:  'evaluación por vano entre apoyos',
  tramo: 'evaluación por tramo entre lecturas'
};

/* ------------------------------------------------------------ utilidades -- */
function num(v, d){
  if (v === '' || v === null || v === undefined) return d;
  const x = typeof v === 'number' ? v : parseFloat(String(v).replace(',','.'));
  return Number.isFinite(x) ? x : d;
}
/* TEXT(x,"0.0") de Excel: redondeo half-away-from-zero, no el de toFixed */
function fmt(x, d){
  if (!Number.isFinite(x)) return '—';
  const r = excelRound(x, d);
  return r.toFixed(d);
}
function fmtSigno(x, d){
  if (!Number.isFinite(x)) return '—';
  const r = excelRound(x, d);
  return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r).toFixed(d);
}

<script>
/* ============================================================================
 * IO — Lectura de datos de campo y persistencia del proyecto
 * ----------------------------------------------------------------------------
 * Sin dependencias externas: el .xlsx se abre con un lector ZIP mínimo sobre
 * DecompressionStream('deflate-raw'), nativo en Chrome.
 * ========================================================================= */

/* -------------------------------------------------- PENZD (.txt de campo) --
 * Formato confirmado en los archivos de la estación Leica TS10:
 *   Punto,Este,Norte,Cota,Descripción
 *   39,275256.4038,8944881.4765,4362.1054,COL- 7E_TOP
 * Los identificadores no siempre son numéricos: E9, E4, E1. son estacionamientos
 * (sin descripción). Se conservan pero quedan marcados para poder descartarlos.
 * ------------------------------------------------------------------------- */
function parsePENZD(texto){
  const filas = [], errores = [];
  const lineas = String(texto).split(/\r?\n/);

  lineas.forEach((linea, i) => {
    const s = linea.trim();
    if (!s || s.startsWith('#') || s.startsWith('//')) return;

    // coma → punto y coma → tabulador → espacios
    let campos = s.includes(',') ? s.split(',')
               : s.includes(';') ? s.split(';')
               : s.includes('\t') ? s.split('\t')
               : s.split(/\s+/);
    campos = campos.map(c => c.trim());

    if (campos.length < 4){ errores.push({linea:i+1, texto:s, motivo:'menos de 4 campos'}); return; }

    const e = parseFloat(campos[1]), n = parseFloat(campos[2]), z = parseFloat(campos[3]);
    if (!Number.isFinite(e) || !Number.isFinite(n) || !Number.isFinite(z)){
      errores.push({linea:i+1, texto:s, motivo:'E/N/Z no numérico'}); return;
    }
    const desc = campos.slice(4).join(',').trim();
    filas.push({
      pto: campos[0], e, n, z, desc,
      // sin descripción y con ID no numérico ⇒ estacionamiento, no dato de obra
      auxiliar: desc === '' && !/^\d+$/.test(campos[0]),
      linea: i + 1
    });
  });
  return { filas, errores };
}

/* ------------------------------------------------------------------ CSV --- */
function parseCSV(texto){
  const sep = detectarSeparador(texto);
  return String(texto).split(/\r?\n/).filter(l => l.trim() !== '').map(linea => {
    const out = []; let cur = '', dentro = false;
    for (let i = 0; i < linea.length; i++){
      const ch = linea[i];
      if (ch === '"'){
        if (dentro && linea[i+1] === '"'){ cur += '"'; i++; } else dentro = !dentro;
      } else if (ch === sep && !dentro){ out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(c => c.trim());
  });
}
function detectarSeparador(texto){
  const muestra = String(texto).split(/\r?\n/).slice(0,10).join('\n');
  const cuenta = c => (muestra.match(new RegExp('\\' + c, 'g')) || []).length;
  const cands = [[',',cuenta(',')], [';',cuenta(';')], ['\t',cuenta('\t')]];
  cands.sort((a,b) => b[1] - a[1]);
  return cands[0][1] > 0 ? cands[0][0] : ',';
}

/* ------------------------------------------------------- XLSX (ZIP + XML) --
 * Lector mínimo de OOXML. Solo lo necesario: sharedStrings + celdas de cada
 * hoja, devueltas como matriz de texto. Sin fórmulas ni formatos.
 * ------------------------------------------------------------------------- */
async function leerXLSX(arrayBuffer){
  const entradas = await descomprimirZIP(arrayBuffer);
  const texto = n => entradas.has(n) ? new TextDecoder('utf-8').decode(entradas.get(n)) : null;
  const dom   = n => { const t = texto(n); return t ? new DOMParser().parseFromString(t, 'application/xml') : null; };

  const wb = dom('xl/workbook.xml');
  if (!wb) throw new Error('No parece un .xlsx válido: falta xl/workbook.xml');

  // rId → ruta de la hoja
  const rels = dom('xl/_rels/workbook.xml.rels');
  const mapaRel = new Map();
  if (rels) Array.from(rels.getElementsByTagName('Relationship')).forEach(r => {
    let t = r.getAttribute('Target') || '';
    if (t.startsWith('/')) t = t.slice(1); else if (!t.startsWith('xl/')) t = 'xl/' + t;
    mapaRel.set(r.getAttribute('Id'), t.replace('xl/../','').replace(/^\.\//,''));
  });

  // sharedStrings
  const ss = dom('xl/sharedStrings.xml');
  const compartidas = ss
    ? Array.from(ss.getElementsByTagName('si')).map(si =>
        Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''))
    : [];

  const hojas = [];
  Array.from(wb.getElementsByTagName('sheet')).forEach(s => {
    const rid  = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const ruta = mapaRel.get(rid);
    const doc  = ruta ? dom(ruta) : null;
    hojas.push({ nombre: s.getAttribute('name'), filas: doc ? hojaAMatriz(doc, compartidas) : [] });
  });
  if (!hojas.length) throw new Error('El archivo no contiene hojas legibles.');
  return hojas;
}

function hojaAMatriz(doc, compartidas){
  const matriz = [];
  Array.from(doc.getElementsByTagName('row')).forEach(row => {
    const idx = parseInt(row.getAttribute('r'), 10) - 1;
    const fila = matriz[idx] || (matriz[idx] = []);
    Array.from(row.getElementsByTagName('c')).forEach(c => {
      const ref = c.getAttribute('r') || '';
      const col = letrasAIndice((ref.match(/^[A-Z]+/) || ['A'])[0]);
      const t   = c.getAttribute('t');
      let valor = '';
      if (t === 'inlineStr'){
        valor = Array.from(c.getElementsByTagName('t')).map(n => n.textContent).join('');
      } else {
        const v = c.getElementsByTagName('v')[0];
        if (v){
          valor = v.textContent;
          if (t === 's') valor = compartidas[parseInt(valor,10)] ?? '';
        }
      }
      fila[col] = valor;
    });
  });
  for (let i = 0; i < matriz.length; i++) if (!matriz[i]) matriz[i] = [];
  return matriz;
}
function letrasAIndice(letras){
  let n = 0;
  for (let i = 0; i < letras.length; i++) n = n * 26 + (letras.charCodeAt(i) - 64);
  return n - 1;
}

/* Lector ZIP: recorre el directorio central y descomprime cada entrada. */
async function descomprimirZIP(buffer){
  const bytes = new Uint8Array(buffer);
  const dv    = new DataView(buffer);
  const u16 = o => dv.getUint16(o, true), u32 = o => dv.getUint32(o, true);

  // Fin del directorio central (0x06054b50), buscando hacia atrás
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0 && i >= bytes.length - 22 - 65535; i--){
    if (u32(i) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Archivo ZIP/XLSX corrupto: no se encontró el directorio central.');

  const total = u16(eocd + 10);
  let off = u32(eocd + 16);
  const entradas = new Map();

  for (let i = 0; i < total; i++){
    if (u32(off) !== 0x02014b50) break;
    const metodo   = u16(off + 10);
    const compLen  = u32(off + 20);
    const nomLen   = u16(off + 28);
    const extraLen = u16(off + 30);
    const comLen   = u16(off + 32);
    const localOff = u32(off + 42);
    const nombre   = new TextDecoder('utf-8').decode(bytes.subarray(off + 46, off + 46 + nomLen));

    // Cabecera local: los tamaños de "extra" pueden diferir del directorio
    const lNomLen   = u16(localOff + 26);
    const lExtraLen = u16(localOff + 28);
    const inicio    = localOff + 30 + lNomLen + lExtraLen;
    const crudo     = bytes.subarray(inicio, inicio + compLen);

    if (!nombre.endsWith('/')){
      entradas.set(nombre, metodo === 0 ? crudo : await inflarRaw(crudo));
    }
    off += 46 + nomLen + extraLen + comLen;
  }
  return entradas;
}

async function inflarRaw(datos){
  if (typeof DecompressionStream === 'undefined'){
    throw new Error('Este navegador no soporta DecompressionStream. Usa Chrome, o exporta el Excel a .csv.');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([datos]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* ------------------------------------------------ Pre-proceso CD/CI ------ */
/* Dos lecturas del mismo punto en caras distintas del anteojo (círculo directo
 * e inverso) llegan como dos registros con la MISMA descripción y coordenadas
 * casi idénticas. Se promedian y se informa la discrepancia como control de
 * calidad. La comprobación de cercanía es imprescindible: en los archivos
 * reales hay descripciones repetidas que son puntos distintos — p. ej.
 * COL_3.1A_BASE aparece dos veces separado 15 m (es un TOP mal rotulado). */
function promediarCarasCDCI(puntos, radioMm){
  const radio = (radioMm == null ? 50 : radioMm) / 1000;
  const grupos = new Map();
  puntos.forEach(p => {
    const k = (p.desc || '').trim().toUpperCase();
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(p);
  });

  const salida = [], pares = [];
  grupos.forEach(lista => {
    const usados = new Array(lista.length).fill(false);
    lista.forEach((p, i) => {
      if (usados[i]) return;
      const cluster = [p]; usados[i] = true;
      for (let j = i + 1; j < lista.length; j++){
        if (usados[j]) continue;
        const q = lista[j];
        const d = Math.sqrt((p.e-q.e)**2 + (p.n-q.n)**2 + (p.z-q.z)**2);
        if (d <= radio){ cluster.push(q); usados[j] = true; }
      }
      if (cluster.length === 1){ salida.push(p); return; }

      const prom = {
        pto: cluster.map(c => c.pto).join('/'),
        e: media(cluster.map(c => c.e)),
        n: media(cluster.map(c => c.n)),
        z: media(cluster.map(c => c.z)),
        desc: p.desc, auxiliar: false, linea: p.linea, caras: cluster.length
      };
      const disc = Math.max.apply(null, cluster.map(c =>
        Math.sqrt((c.e-prom.e)**2 + (c.n-prom.n)**2 + (c.z-prom.z)**2) * 1000));
      prom.discrepanciaMm = disc * 2;   // separación total entre caras
      pares.push({ desc: p.desc, puntos: cluster.map(c => c.pto), discrepanciaMm: prom.discrepanciaMm });
      salida.push(prom);
    });
  });
  salida.sort((a,b) => a.linea - b.linea);
  return { puntos: salida, pares };
}
function media(a){ return a.reduce((s,x) => s + x, 0) / a.length; }

/* ------------------------------------------------ Detección automática ----
 * Las descripciones de campo son heterogéneas. En los archivos reales conviven
 *   COL_1B_TOP · COL- 7E_BASE · COL-1.1F_TOP OK · PB_F3.1 · PB  3.1 E · PB_A1.1
 * Se tokeniza, se apartan los prefijos y las palabras de rol o de anotación, y
 * el resto se interpreta como eje. Es siempre una PROPUESTA editable.
 * ------------------------------------------------------------------------- */
const TOK_ROL_SUP  = ['TOP','SUP','SUPERIOR','ALTO','CABEZA'];
const TOK_ROL_BASE = ['BASE','INF','INFERIOR','BAJO','PIE'];
const TOK_RUIDO    = ['COL','COLUMNA','COLUMN','PB','PLACA','PLATE','EJE','AXIS','OK','REV','CD','CI',
                      'DIRECTO','INVERSO','MASO','LIBRE','NUEVO','CHECK'];

function tokenizarDesc(desc){
  return String(desc || '').toUpperCase()
    .replace(/[^A-Z0-9.]+/g, ' ')
    .trim().split(/\s+/).filter(Boolean);
}

function ejeDesdeDescripcion(desc){
  const restos = tokenizarDesc(desc).filter(t =>
    TOK_ROL_SUP.indexOf(t) < 0 && TOK_ROL_BASE.indexOf(t) < 0 && TOK_RUIDO.indexOf(t) < 0);
  // "3.1" + "E" llegan como dos tokens; "1.1F" como uno. Se unen y se analizan.
  let s = restos.join('').replace(/EJE/g, '').replace(/^\.+|\.+$/g, '');
  if (!s) return '';
  const m = s.match(/^(\d+(?:\.\d+)?)([A-Z])$/);        // 1F · 3.1A · 1.4F
  if (m) return m[1] + '-' + m[2];
  const m2 = s.match(/^([A-Z])(\d+(?:\.\d+)?)$/);       // F3.1 · A1.1 · B1
  if (m2) return m2[2] + '-' + m2[1];
  return s;
}

function rolDesdeDescripcion(desc){
  const t = tokenizarDesc(desc);
  if (t.some(x => TOK_ROL_SUP.indexOf(x)  >= 0)) return 'sup';
  if (t.some(x => TOK_ROL_BASE.indexOf(x) >= 0)) return 'base';
  return null;
}

/* ----------------------------------------------------- Archivos y disco -- */
/* Dentro de un iframe —como el de la página publicada— el navegador bloquea
   la descarga automática por `<a download>`: el clic no hace nada y el usuario
   se queda sin archivo. Se detecta el contexto embebido y se abre un panel con
   la imagen a resolución completa, desde el que sí se puede guardar. */
const EMBEBIDO = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();

function descargar(nombre, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return url;
}
function pedirArchivo(accept, comoTexto){
  return new Promise(resolve => {
    const inp = document.getElementById('filePicker');
    inp.value = ''; inp.accept = accept || '';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return resolve(null);
      const fr = new FileReader();

      comoTexto ? fr.readAsText(f, 'utf-8') : fr.readAsArrayBuffer(f);
    };
    inp.click();

  wnTxt:'#7A5C00', wnBg:'#FFE082', wnBd:'#BF8F00',

  /* Ámbar de umbrales y promedios en los gráficos. Va aparte del acento de
     marca: hay temas cuyo acento es rojo, y una línea de «umbral de alerta»

  blanco:'#FFFFFF'
};

const BLANCO = '#FFFFFF', NEGRO = '#000000';
/* Mezcla en sRGB. t=0 devuelve `a`; t=1, `b`. */
function mezclar(a, b, t){
  const hex = s => [1,3,5].map(i => parseInt(s.substr(i,2),16));
  const A = hex(a), B = hex(b);
  return '#' + [0,1,2].map(i =>
    Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2,'0')).join('');
}
/* Los tintes salen del color primario, así que definir un tema nuevo es dar dos
   colores. Los factores reproducen la relación que ya tenían entre sí los
   tokens sacados de xl/styles.xml del libro. */
function tintes(pri){
  return {
    azul:    pri,
    azulOsc: mezclar(pri, NEGRO,  0.333),
    azulMed: mezclar(pri, BLANCO, 0.55),
    azulCl:  mezclar(pri, BLANCO, 0.87),
    azulXcl: mezclar(pri, BLANCO, 0.955),
    hdrSep:  mezclar(pri, BLANCO, 0.29)
  };
}
