/* ============================================================================
 * EXPORTACIÓN — PNG de alta resolución y SVG vectorial
 * ========================================================================= */
const PRESETS = {
  a4:  { mm:170, etiqueta:'A4 Word (170 mm)' },
  ppt: { mm:240, etiqueta:'PowerPoint 16:9 (240 mm)' }
};

function svgDesde(nodo){
  const svg = nodo.tagName && nodo.tagName.toLowerCase() === 'svg' ? nodo : nodo.querySelector('svg');
  if (!svg) throw new Error('No hay gráfico que exportar en este bloque.');
  return svg;
}

function serializar(svg, anchoPx){
  const clon = svg.cloneNode(true);
  const vb = (clon.getAttribute('viewBox') || '0 0 100 100').split(/\s+/).map(Number);
  const ratio = vb[3] / vb[2];
  clon.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clon.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  if (anchoPx){
    clon.setAttribute('width',  Math.round(anchoPx));
    clon.setAttribute('height', Math.round(anchoPx * ratio));
  }
  return { xml: new XMLSerializer().serializeToString(clon), ratio };
}

/* PNG a la densidad pedida. El ancho en píxeles sale del ancho físico previsto:
   170 mm a 300 dpi = 2008 px, suficiente para imprimir sin pixelar. */
function exportarPNG(nodo, dpi, mm){
  const svg = svgDesde(nodo);
  const natural = parseFloat(svg.getAttribute('data-mm')) || 170;
  // Nunca por debajo del ancho natural: reducirlo solo perdería resolución
  const anchoMm = mm ? Math.max(mm, natural) : natural;
  const px = anchoMm / 25.4 * (dpi || 300);
  const { xml, ratio } = serializar(svg, px);
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);

  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width  = Math.round(px);
      cv.height = Math.round(px * ratio);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => b ? resolve({blob:b, w:cv.width, h:cv.height}) : reject(new Error('No se pudo generar el PNG.')), 'image/png');
    };
    img.onerror = () => reject(new Error('El navegador no pudo rasterizar el gráfico.'));
    img.src = url;
  });
}

function exportarSVG(nodo){
  const svg = svgDesde(nodo);
  const { xml } = serializar(svg, null);
  return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + xml], {type:'image/svg+xml;charset=utf-8'});
}

async function copiarPNG(nodo, dpi, mm){
  const { blob } = await exportarPNG(nodo, dpi, mm);
  if (!navigator.clipboard || !window.ClipboardItem) throw new Error('El navegador no permite copiar imágenes al portapapeles.');
  await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
}

function nombreArchivo(proy, titulo, ext){
  const limpio = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60);
  const fecha = new Date().toISOString().slice(0,10);
  return [limpio(proy.nombre) || 'MAKYL', limpio(titulo), fecha].filter(Boolean).join('_') + '.' + ext;
}

/* =========================================================== VALIDACIÓN === */
function comparar(obtenido, esperado){
  if (typeof esperado === 'string' || typeof obtenido === 'string')
    return String(obtenido) === String(esperado) ? 'exacto' : 'fallo';
  if (obtenido === esperado) return 'exacto';
  const d = Math.abs(obtenido - esperado);
  const rel = Math.abs(esperado) > 1e-12 ? d / Math.abs(esperado) : d;
  return rel < 1e-12 ? 'aprox' : 'fallo';
}

/* Auditoría geométrica de una lámina: se monta el SVG fuera de pantalla y se
   miden las cajas reales de texto con getBBox. No estima nada — es la única
   forma de afirmar que un tema con tipografía ancha no se sale de la lámina ni
   mete un rótulo dentro de la columna vecina. */
function auditarSVG(svgTexto){
  const caja = document.createElement('div');
  caja.setAttribute('style', 'position:absolute;left:-10000px;top:0;width:2400px;visibility:hidden');
  caja.innerHTML = svgTexto;
  document.body.appendChild(caja);
  try{
    const svg = caja.querySelector('svg');
    const W = svg.viewBox.baseVal.width;
    const ts = Array.from(svg.querySelectorAll('text')).map(t => {
      const b = t.getBBox();
      return {y: Math.round(b.y), x: b.x, x2: b.x + b.width};
    });
    const fuera = ts.filter(t => t.x < -0.5 || t.x2 > W + 0.5).length;
    /* Se comparan solo rótulos de la MISMA línea de base: dos textos a distinta
       altura pueden compartir abscisa sin pisarse. */
    const lineas = {};
    ts.forEach(t => { (lineas[t.y] = lineas[t.y] || []).push(t); });
    let cruces = 0;
    Object.keys(lineas).forEach(k => {
      const f = lineas[k].sort((a,b) => a.x - b.x);
      for (let i = 1; i < f.length; i++) if (f[i].x < f[i-1].x2 - 0.6) cruces++;
    });
    return {fuera, cruces};
  } finally { caja.remove(); }
}

function correrTests(){
  const niv = calcNivelacion(PROYECTO_VALIDACION.nivelacion, PROYECTO_VALIDACION.params.nivelacion);
  const ver = calcVerticalidad(PROYECTO_VALIDACION.verticalidad, PROYECTO_VALIDACION.params.verticalidad);
  const pla = calcPlanoEjes(PROYECTO_VALIDACION.ejesX, PROYECTO_VALIDACION.ejesY,
                            PROYECTO_VALIDACION.columnasPlano, ver, PROYECTO_VALIDACION.params.plano);
  /* El libro aplica la tolerancia del vano completo a todas las filas. El
     criterio se ancla aquí explícitamente para que el modo por defecto de la
     app —hoy 'tramo'— no afecte a la comprobación de paridad. */
  const def = calcDeflexion(PROYECTO_VALIDACION.deflexion,
    Object.assign({}, PROYECTO_VALIDACION.params.deflexion, {modo:'vano'}));
  const E = ESPERADO_EXCEL;
  const pruebas = [];
  const chk = (grupo, nombre, obt, esp) => pruebas.push({grupo, nombre, obt, esp, r: comparar(obt, esp)});

  chk('Nivelación (hoja 1)', 'Promedio de desviación máxima · G28', niv.promedio, E.nivelacion.promedio);
  chk('Nivelación (hoja 1)', 'Conteo de placas que cumplen · G29', niv.conteo.texto, E.nivelacion.conteo);
  /* Las comprobaciones se hacen POR NOMBRE DE EJE, no por número de fila: la
     app ordena su salida de forma correlativa y una prueba atada al índice se
     rompería por un cambio de orden, no por un error de cálculo. */
  const porEje = (filas, eje) => filas.find(f => f.eje === eje);
  E.nivelacion.desvMax.forEach((v,i) => {
    const eje = PROYECTO_VALIDACION.nivelacion[i].eje, f = porEje(niv.filas, eje);
    chk('Nivelación (hoja 1)', 'Desviación máxima de ' + eje + ' · G' + (7+i), f ? f.desvMax : null, v);
  });

  chk('Verticalidad (hoja 2)', 'Desviación máxima registrada · F30', ver.maximo, E.verticalidad.maximo);
  chk('Verticalidad (hoja 2)', 'Conteo de columnas que cumplen · F31', ver.conteo.texto, E.verticalidad.conteo);
  E.verticalidad.filas.forEach((e,i) => {
    const f = porEje(ver.filas, e.eje) || {}, fila = ' · fila ' + (9+i) + ' del libro';
    chk('Verticalidad (hoja 2)', e.eje + ' ΔE'    + fila, f.dE, e.dE);
    chk('Verticalidad (hoja 2)', e.eje + ' ΔN'    + fila, f.dN, e.dN);
    chk('Verticalidad (hoja 2)', e.eje + ' total' + fila, f.desvTotal, e.total);
    chk('Verticalidad (hoja 2)', e.eje + ' H'     + fila, f.alturaH, e.H);
    chk('Verticalidad (hoja 2)', e.eje + ' tol'   + fila, f.tol, e.tol);
    chk('Verticalidad (hoja 2)', e.eje + ' dirección' + fila, f.direccion, e.dir);
    chk('Verticalidad (hoja 2)', e.eje + ' evaluación' + fila, f.evaluacion, e.ev);
  });
  // El orden de salida debe ser correlativo, no el de captura en campo
  chk('Verticalidad (hoja 2)', 'La salida sale ordenada por eje',
      ver.filas.map(f => f.eje).join(','),
      ver.filas.map(f => f.eje).slice().sort(ordenEje).join(','));

  chk('Plano de ejes (hoja 3)', 'Escala de flechas · D6', pla.escala, E.plano.escala);
  E.plano.etiquetas.forEach((v,i) =>
    chk('Plano de ejes (hoja 3)', 'Etiqueta ' + pla.puntos[i].clave + ' · AV' + (8+i), pla.puntos[i].etiqueta, v));

  chk('Deflexión (hoja 4)', 'ΔEste dE · V9',  def.dE, E.deflexion.dE);
  chk('Deflexión (hoja 4)', 'ΔNorte dN · V10', def.dN, E.deflexion.dN);
  chk('Deflexión (hoja 4)', 'Longitud L · V11', def.L, E.deflexion.L);
  chk('Deflexión (hoja 4)', 'Tolerancia L/500 · V12', def.tol, E.deflexion.tol);
  chk('Deflexión (hoja 4)', 'Umbral 0.8×L/500 · V13', def.umbralMm, E.deflexion.umbral);
  E.deflexion.dz.forEach((v,i) => chk('Deflexión (hoja 4)', 'Δz punto ' + def.puntos[i].pto + ' · AB' + (9+i), def.puntos[i].dz, v));
  E.deflexion.x.forEach((v,i)  => chk('Deflexión (hoja 4)', 'X punto '  + def.puntos[i].pto + ' · Z'  + (9+i), def.puntos[i].x, v));
  chk('Deflexión (hoja 4)', 'Deflexión máxima · E17', def.dzMax, E.deflexion.dzMax);
  chk('Deflexión (hoja 4)', 'Ubicación X del máximo · H17', def.xMax, E.deflexion.xMax);
  chk('Deflexión (hoja 4)', 'Punto del máximo · J17', def.ptoMax, E.deflexion.ptoMax);
  chk('Deflexión (hoja 4)', 'Conteo de tramos · E18', def.conteo.texto, E.deflexion.conteo);
  chk('Deflexión (hoja 4)', 'Evaluación global · E19', def.global, E.deflexion.global);

  /* --- Criterio alternativo: tolerancia por tramo entre lecturas --------- */
  const defT = calcDeflexion(PROYECTO_VALIDACION.deflexion,
    Object.assign({}, PROYECTO_VALIDACION.params.deflexion, {modo:'tramo'}));
  const T = E.deflexionTramo;
  T.L.forEach((v,i)   => chk('Deflexión — modo tramo', 'Longitud real del tramo ' + (i+1) + ' (m)', defT.tramos[i].L,   v));
  T.Lmm.forEach((v,i) => chk('Deflexión — modo tramo', 'Longitud del tramo ' + (i+1) + ' en mm',   defT.tramos[i].Lmm, v));
  T.tol.forEach((v,i) => chk('Deflexión — modo tramo', 'Tolerancia del tramo ' + (i+1), defT.tramos[i].tol, v));
  T.ev.forEach((v,i)  => chk('Deflexión — modo tramo', 'Evaluación del tramo ' + (i+1), defT.tramos[i].evaluacion, v));
  chk('Deflexión — modo tramo', 'Conteo de tramos', defT.conteo.texto, T.conteo);
  chk('Deflexión — modo tramo', 'Evaluación global', defT.global, T.global);
  chk('Deflexión — modo tramo', 'Δz no cambia respecto al modo vano (cuerda global)',
      defT.puntos.map(p => p.dz).join('|'), E.deflexion.dz.join('|'));
  // Ninguna distancia de tramo puede ser nula: siempre hay separación medida
  defT.tramos.forEach((t,i) => chk('Deflexión — modo tramo',
      'El tramo ' + (i+1) + ' tiene longitud medida (> 0)', t.L > 0, true));

  /* --- La tolerancia varía con la distancia real de cada tramo ----------- */
  const def240 = calcDeflexion(PROYECTO_VALIDACION.deflexion,
    Object.assign({}, PROYECTO_VALIDACION.params.deflexion, {modo:'tramo', divisor:240}));
  const T240 = E.deflexionTramo240;
  T240.tol.forEach((v,i) => chk('Deflexión — L/240 por tramo',
      'Tolerancia del tramo ' + (i+1) + ' (mm)', excelRound(def240.tramos[i].tol, 4), v));
  T240.ev.forEach((v,i)  => chk('Deflexión — L/240 por tramo',
      'Evaluación del tramo ' + (i+1), def240.tramos[i].evaluacion, v));
  chk('Deflexión — L/240 por tramo', 'Conteo de tramos', def240.conteo.texto, T240.conteo);
  chk('Deflexión — L/240 por tramo', 'Evaluación global', def240.global, T240.global);
  chk('Deflexión — L/240 por tramo', 'La tolerancia NO es la misma en todas las filas',
      new Set(def240.tramos.map(t => excelRound(t.tol,3))).size > 1, true);

  /* --- Lecturas coincidentes: se fusionan, ningún tramo queda en 0 ------- */
  const conDup = PROYECTO_VALIDACION.deflexion.slice(0,2)
    .concat([Object.assign({}, PROYECTO_VALIDACION.deflexion[1])])
    .concat(PROYECTO_VALIDACION.deflexion.slice(2));
  const defDup = calcDeflexion(conDup,
    Object.assign({}, PROYECTO_VALIDACION.params.deflexion, {modo:'tramo'}));
  chk('Deflexión — lecturas coincidentes', 'Se detecta y fusiona la lectura repetida', defDup.fusionados.length, 1);
  chk('Deflexión — lecturas coincidentes', 'Quedan los 5 tramos, sin uno de longitud nula', defDup.tramos.length, 5);
  chk('Deflexión — lecturas coincidentes', 'Ninguna longitud de tramo es 0',
      defDup.tramos.every(t => t.L > 0), true);
  chk('Deflexión — lecturas coincidentes', 'Ninguna tolerancia de tramo es 0',
      defDup.tramos.every(t => t.tol > 0), true);
  chk('Deflexión — lecturas coincidentes', 'El resultado coincide con el del dato sin duplicar',
      defDup.conteo.texto, T.conteo);

  /* --- Orden correlativo aunque los datos lleguen desordenados ----------- */
  const desordenado = [PROYECTO_VALIDACION.deflexion[5], PROYECTO_VALIDACION.deflexion[2],
                       PROYECTO_VALIDACION.deflexion[0], PROYECTO_VALIDACION.deflexion[4],
                       PROYECTO_VALIDACION.deflexion[1], PROYECTO_VALIDACION.deflexion[3]];
  const defOrd = calcDeflexion(desordenado,
    Object.assign({}, PROYECTO_VALIDACION.params.deflexion, {modo:'tramo'}));
  chk('Deflexión — orden correlativo', 'Los puntos se ordenan por su posición sobre la viga',
      defOrd.puntos.map(p => p.pto).join(','), '1,3,4,5,6,7');
  chk('Deflexión — orden correlativo', 'Las distancias de tramo salen iguales que con el dato ordenado',
      defOrd.tramos.map(t => t.L).join('|'), T.L.join('|'));
  chk('Deflexión — orden correlativo', 'Ningún tramo enlaza extremos no contiguos',
      defOrd.tramos.every(t => t.L < 20), true);

  /* ---------------------------------------------------------------------
   * Planos: los solapes se comprueban por geometría, no a ojo. Se recorre
   * el resultado del colocador de etiquetas sobre los datos reales —el caso
   * denso, con los ejes 3.7 / 4 / 4.4 a 2.1 m entre sí— y se afirma que
   * ninguna caja corta a otra ni se sale de la lámina.
   * ------------------------------------------------------------------- */
  const solapan = (a,b) => a.x < b.x + b.w && a.x + a.w > b.x &&
                           a.y < b.y + b.h && a.y + a.h > b.y;

  [ {nombre:'Plano de nivelación', svg: graficoPlanoNivelacion(pla, niv, PROYECTO_VALIDACION)},
    {nombre:'Plano de verticalidad', svg: graficoPlanoCombinado(pla, ver, niv, PROYECTO_VALIDACION)} ]
  .forEach(caso => {
    const cajas = (window.__ultimasCajas && window.__ultimasCajas[caso.nombre]) || [];
    let cruces = 0;
    for (let i = 0; i < cajas.length; i++)
      for (let j = i+1; j < cajas.length; j++)
        if (solapan(cajas[i], cajas[j])) cruces++;
    chk('Planos — solapes', caso.nombre + ': etiquetas que se cruzan entre sí', cruces, 0);
    const fuera = cajas.filter(c => c.__fuera).length;
    chk('Planos — solapes', caso.nombre + ': etiquetas fuera de la lámina', fuera, 0);
    chk('Planos — solapes', caso.nombre + ': se generó el dibujo', caso.svg.indexOf('<svg') === 0, true);
  });

  // Escala idéntica en X y en Y: un plano en planta no puede deformarse
  const kk = window.__ultimaEscala || {};
  chk('Planos — escala', 'La escala en X y en Y es la misma', kk.kX === kk.kY, true);

  /* ---------------------------------------------------------------------
   * Filas de apoyo mudas. Es un cambio de presentación, así que lo que hay
   * que demostrar es doble: que la tabla calla el cero del apoyo y que NO
   * ha movido ni un número del cálculo.
   * ------------------------------------------------------------------- */
  const ultimo = def.tramos[def.tramos.length - 1];
  chk('Deflexión — filas de apoyo', 'El último tramo termina en un apoyo', ultimo.apoyo, true);
  /* «Cero» con el mismo criterio que usa la tabla: la cuerda se reconstruye por
     interpolación, así que el residuo es de coma flotante, no exactamente 0. */
  chk('Deflexión — filas de apoyo', 'Su deflexión contra la cuerda es nula', Math.abs(ultimo.dz) < 1e-6, true);
  chk('Deflexión — filas de apoyo', 'La tabla no lo lista', tramoDeApoyo(ultimo), true);
  chk('Deflexión — filas de apoyo', 'Queda fuera de los tramos visibles',
      def.tramosVisibles.indexOf(ultimo), -1);
  chk('Deflexión — filas de apoyo', 'Los tramos intermedios sí se listan',
      def.tramosVisibles.length, def.tramos.length - 1);
  chk('Deflexión — filas de apoyo', 'El conteo publicado deja fuera el apoyo',
      def.conteoVisible.texto, (def.tramos.length - 1) + ' / ' + (def.tramos.length - 1));
  /* El cálculo NO se toca: `conteo` sigue siendo el del libro, y es lo que
     compara la paridad contra el Excel. Lo que cambia es lo que se publica. */
  chk('Deflexión — filas de apoyo', 'El conteo del Excel sigue intacto', def.conteo.texto, E.deflexion.conteo);
  chk('Deflexión — filas de apoyo', 'La evaluación global no cambia', def.global, E.deflexion.global);
  chk('Deflexión — filas de apoyo', 'El apoyo se sigue evaluando por dentro', ultimo.evaluacion, CUMPLE);
  chk('Deflexión — filas de apoyo', 'La tabla ya no trae columna de % de tolerancia',
      tablaDeflexion(def, PROYECTO_VALIDACION).indexOf('% DE') < 0, true);
  /* Un apoyo intermedio en modo tramo se mide contra la cuerda GLOBAL, así que
     su Δz es una medición real y tiene que seguir viéndose. Se construye el
     caso marcando como apoyo el punto central del dato de validación. */
  const conApoyoMedio = PROYECTO_VALIDACION.deflexion.map((p,i) =>
    Object.assign({}, p, i === 3 ? {rol:ROL_APOYO} : {}));
  const defMedio = calcDeflexion(conApoyoMedio,
    Object.assign({}, PROYECTO_VALIDACION.params.deflexion, {modo:'tramo'}));
  const trMedio = defMedio.tramos.find(t => String(t.punto) === String(PROYECTO_VALIDACION.deflexion[3].pto));
  chk('Deflexión — filas de apoyo', 'El apoyo intermedio está marcado como tal', trMedio.apoyo, true);
  chk('Deflexión — filas de apoyo', 'Su Δz contra la cuerda global no es cero', Math.abs(trMedio.dz) > 1, true);
  chk('Deflexión — filas de apoyo', 'Y por tanto SÍ se lista', tramoDeApoyo(trMedio), false);
  chk('Deflexión — filas de apoyo', 'Y aparece entre los tramos visibles',
      defMedio.tramosVisibles.indexOf(trMedio) >= 0, true);

  /* ---------------------------------------------------------------------
   * Tamaño de flecha del plano. El deslizador MANDA: lo que se pide es lo que
   * se dibuja, con el único suelo del tamaño legible. El tope antichoque se
   * sigue calculando, pero solo para avisar.
   * ------------------------------------------------------------------- */
  let largoPrevio = -1;
  [2, 6, 12, 20].forEach(mm => {
    graficoPlanoCombinado(pla, ver, niv,
      Object.assign({}, PROYECTO_VALIDACION, {params:
        Object.assign({}, PROYECTO_VALIDACION.params, {plano:
          Object.assign({}, PROYECTO_VALIDACION.params.plano, {flechaLargoMm: mm})})}));
    const f = window.__flechaPlano;
    chk('Flechas del plano', 'Con ' + mm + ' mm pedidos se dibujan ' + Math.max(mm, 2.4) + ' mm',
        f.dibujadoMm, Math.max(mm, 2.4));
    chk('Flechas del plano', 'Con ' + mm + ' mm pedidos nunca baja del suelo legible',
        f.dibujadoMm >= 2.4 - 1e-9, true);
    /* Lo que el usuario reportó como roto: subir el control y no ver cambio. */
    chk('Flechas del plano', 'Subir el control alarga la flecha', f.dibujadoMm > largoPrevio, true);
    chk('Flechas del plano', 'Se avisa cuando el valor supera el tope antichoque',
        f.dibujadoMm > f.topeMm ? f.invade : !f.invade, true);
    largoPrevio = f.dibujadoMm;
  });

  /* ---------------------------------------------------------------------
   * Temas intercambiables. El tema es identidad visual: puede cambiarlo todo
   * menos los números y la colocación. Se recorre el catálogo entero pintando
   * las cuatro láminas y se comprueba por geometría que ninguna se rompe.
   * ------------------------------------------------------------------- */
  /* ---------------------------------------------------------------------
   * ZIP de «Exportar todo». Se comprueba la estructura del archivo, no que el
   * navegador lo descargue: firmas, CRC de cada entrada y número de entradas.
   * Un CRC mal calculado da un .zip que Windows abre… y luego rechaza.
   * ------------------------------------------------------------------- */
  const cod = new TextEncoder();
  const muestra = [{nombre:'a.txt', bytes: cod.encode('MAKYL')},
                   {nombre:'b.txt', bytes: cod.encode('deflexión ± 47.3 mm')}];
  const bytesZip = zipBytes(muestra);
  chk('Exportar todo (.zip)', 'CRC32 de referencia («123456789»)', crc32(cod.encode('123456789')), 0xCBF43926);
  chk('Exportar todo (.zip)', 'El blob es de tipo zip', zipStore(muestra).type, 'application/zip');
  const leer32 = i => (bytesZip[i] | (bytesZip[i+1]<<8) | (bytesZip[i+2]<<16) | (bytesZip[i+3]<<24)) >>> 0;
  chk('Exportar todo (.zip)', 'Empieza por la firma de cabecera local', leer32(0), 0x04034b50);
  const finCD = bytesZip.length - 22;
  chk('Exportar todo (.zip)', 'Termina en el directorio central', leer32(finCD), 0x06054b50);
  chk('Exportar todo (.zip)', 'Declara las 2 entradas', bytesZip[finCD+10] | (bytesZip[finCD+11]<<8), 2);
  chk('Exportar todo (.zip)', 'El CRC de la primera entrada cuadra', leer32(14), crc32(muestra[0].bytes));
  chk('Exportar todo (.zip)', 'Los nombres van en UTF-8', bytesZip[7] & 0x08, 0x08);

  const temaPrevio = TEMA_ACTIVO.id;
  const refTabla = tablaDeflexion(def, PROYECTO_VALIDACION);
  const cifras = svg => (svg.match(/>[-−+]?\d[\d.,]*(?:\s*(?:mm|m|%))?</g) || []).join('|');
  const cifrasRef = cifras(refTabla);
  TEMAS.forEach(t => {
    aplicarTema(t.id);
    const laminas = {
      'tabla':  tablaDeflexion(def, PROYECTO_VALIDACION),
      'gráfico': graficoDeflexion(def),
      'plano de nivelación':  graficoPlanoNivelacion(pla, niv, PROYECTO_VALIDACION),
      'plano de verticalidad': graficoPlanoCombinado(pla, ver, niv, PROYECTO_VALIDACION)
    };
    Object.keys(laminas).forEach(k =>
      chk('Temas — intercambiables', t.nombre + ': se genera el ' + k,
          laminas[k].indexOf('<svg') === 0, true));

    /* Ni un rótulo fuera de la lámina ni uno encima de otro, medido de verdad
       sobre el SVG montado. Es lo que rompía al cambiar de tipografía. */
    const auditadas = {
      'tabla de deflexión':    laminas['tabla'],
      'tabla de verticalidad': tablaVerticalidad(ver, PROYECTO_VALIDACION),
      'tabla de nivelación':   tablaNivelacion(niv, PROYECTO_VALIDACION),
      'gráfico de severidad':  graficoVerticalidadSeveridad(ver)
    };
    Object.keys(auditadas).forEach(k => {
      const a = auditarSVG(auditadas[k]);
      chk('Temas — sin desbordes', t.nombre + ': texto fuera de la ' + k, a.fuera, 0);
      chk('Temas — sin desbordes', t.nombre + ': rótulos que se pisan en la ' + k, a.cruces, 0);
    });
    /* Mismos números en todos los temas: el tema no toca el dato. */
    chk('Temas — intercambiables', t.nombre + ': las cifras de la tabla no cambian',
        cifras(laminas['tabla']), cifrasRef);
    /* Y la tipografía del tema llega al SVG exportado. */
    chk('Temas — intercambiables', t.nombre + ': el SVG lleva la tipografía del tema',
        laminas['tabla'].indexOf(t.fuente) > 0, true);
    /* El semáforo es señalética, no identidad: no puede moverse con el tema. */
    chk('Temas — intercambiables', t.nombre + ': el semáforo sigue siendo el normativo',
        [C.okBd, C.wnBd, C.bdBd].join('|'), '#2E7D32|#BF8F00|#C62828');
    const cajas = (window.__ultimasCajas || {})['Plano de verticalidad'] || [];
    let cruces = 0;
    for (let i = 0; i < cajas.length; i++)
      for (let j = i+1; j < cajas.length; j++)
        if (solapan(cajas[i], cajas[j])) cruces++;
    chk('Temas — intercambiables', t.nombre + ': etiquetas del plano que se cruzan', cruces, 0);
    chk('Temas — intercambiables', t.nombre + ': etiquetas fuera de la lámina',
        cajas.filter(c => c.__fuera).length, 0);
  });
  aplicarTema(temaPrevio);

  return pruebas;
}

function vistaTests(){
  const pruebas = correrTests();
  const fallos = pruebas.filter(p => p.r === 'fallo');
  const aprox  = pruebas.filter(p => p.r === 'aprox');
  const grupos = [];
  pruebas.forEach(p => {
    let g = grupos.find(x => x.nombre === p.grupo);
    if (!g) grupos.push(g = {nombre:p.grupo, items:[]});
    g.items.push(p);
  });

  const bn = $('#badge-test');
  bn.className = 'nav-badge ' + (fallos.length ? 'bad' : 'ok');
  bn.textContent = (pruebas.length - fallos.length) + '/' + pruebas.length;

  return '<div class="view-head"><h1>Validación contra el Excel</h1>' +
    '<p>Se recalculan los datos reales de Bahías 22-23 y se comparan con los valores que el libro ' +
    '<code>Nivelacion_y_Verticalidad_MAKYL_Rev2.xlsx</code> ya tiene calculados en sus celdas. ' +
    'El Excel es la fuente de verdad: cualquier fila en rojo es un fallo de esta app, no del libro.</p></div>' +

    '<section class="card"><div class="card-head"><h2>Resultado</h2></div><div class="kpis">' +
      '<div class="kpi ' + (fallos.length ? 'bad' : 'ok') + '"><div class="k">Comprobaciones</div><div class="v">' +
        (pruebas.length - fallos.length) + '<span class="u">/ ' + pruebas.length + '</span></div></div>' +
      '<div class="kpi ' + (fallos.length ? 'bad' : 'ok') + '"><div class="k">Fallos</div><div class="v">' + fallos.length + '</div></div>' +
      '<div class="kpi"><div class="k">Idénticas al bit</div><div class="v">' + (pruebas.length - fallos.length - aprox.length) + '</div></div>' +
    '</div></section>' +

    (fallos.length
      ? '<div class="note bad" style="margin-bottom:18px"><b>Hay discrepancias con el Excel.</b> Revisa las filas marcadas abajo antes de usar los resultados en un informe.</div>'
      : '<div class="note" style="margin-bottom:18px"><b>Paridad completa.</b> Los ' + pruebas.length +
        ' valores comprobados coinciden con los del libro' + (aprox.length ? ' (' + aprox.length + ' dentro del error de representación de coma flotante)' : ' de forma exacta') + '.</div>') +

    grupos.map(g => {
      const mal = g.items.filter(i => i.r === 'fallo').length;
      return '<section class="card"><div class="card-head"><h2>' + esc(g.nombre) + '</h2>' +
        '<span class="hint">' + (g.items.length - mal) + ' / ' + g.items.length + ' correctas</span></div>' +
        '<div class="card-body" id="testview"><pre>' + g.items.map(p => {
          const marca = p.r === 'fallo' ? '✗ FALLO' : p.r === 'aprox' ? '≈ OK   ' : '✓ OK   ';
          const cl = p.r === 'fallo' ? 't-fail' : 't-pass';
          let l = '<span class="' + cl + '">' + marca + '</span>  ' + esc(p.nombre);
          if (p.r === 'fallo') l += '\n           esperado: ' + esc(p.esp) + '\n           obtenido: ' + esc(p.obt);
          return l;
        }).join('\n') + '</pre></div></section>';
    }).join('');
}

/* ============================================================== RENDER ==== */
const VISTAS  = { resumen:vistaResumen, nivelacion:vistaNivelacion, verticalidad:vistaVerticalidad,
                  deflexion:vistaDeflexion, ejes:vistaEjes, tests:vistaTests };
const SALIDAS = { nivelacion:salidasNivelacion, verticalidad:salidasVerticalidad,
                  deflexion:salidasDeflexion, ejes:salidasEjes };

function render(){

  $('#views').innerHTML = '<div class="view">' + VISTAS[VISTA]() + '</div>';
  if (SALIDAS[VISTA]) $('#salidas').innerHTML = SALIDAS[VISTA]();
  $('#crumbProj').textContent = PROY.nombre || 'Proyecto sin nombre';
  $('#crumbView').textContent = TITULOS[VISTA];
  $$('.nav-item').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === VISTA)));
  actualizarBadges();
  actualizarEcoFlecha();
}
function actualizarSalidas(){
  recalcular();
  if (SALIDAS[VISTA]) $('#salidas').innerHTML = SALIDAS[VISTA]();
  actualizarBadges();
  actualizarEcoFlecha();
}
function actualizarBadges(){
  badge('#badge-niv', RES.niv);
  badge('#badge-ver', RES.ver);
  /* El badge cuenta lo mismo que publica la tabla: sin los tramos de apoyo. */
  badge('#badge-def', RES.def.tramosVisibles.length
    ? {conteo:RES.def.conteoVisible, tramos:RES.def.tramosVisibles} : null);
}
</script>
<script>
/* ============================================================================
 * UI — Importación, mapeo, exportación y eventos
 * ========================================================================= */

/* ------------------------------------------------- Importación de archivos */
async function importar(mod, fmt){
  try{
    let puntos = null;

    if (fmt === 'txt'){
      const f = await pedirArchivo('.txt,.csv,.dat,text/plain', true);
      if (!f) return;
      const {filas, errores} = parsePENZD(f.contenido);
      if (!filas.length) return toast('No se reconoció ningún punto en ' + f.nombre, true);
      if (errores.length) toast(filas.length + ' puntos leídos · ' + errores.length + ' línea(s) descartadas');
      puntos = filas;

    } else {
      const f = await pedirArchivo('.xlsx,.csv,.txt', false);
      if (!f) return;
      const esCSV = /\.(csv|txt)$/i.test(f.nombre);
      let matriz;
      if (esCSV){
        matriz = parseCSV(new TextDecoder('utf-8').decode(f.contenido));
      } else {
        const hojas = await leerXLSX(f.contenido);
        const conDatos = hojas.filter(h => h.filas.length > 1);
        if (!conDatos.length) return toast('El libro no contiene filas de datos.', true);
        matriz = conDatos[0].filas;
        if (conDatos.length > 1) toast('Se usó la hoja «' + conDatos[0].nombre + '» (la primera con datos).');
      }
      puntos = matrizAPuntos(matriz);
      if (!puntos.length) return toast('No se reconocieron columnas PENZD (Punto, Este, Norte, Z, Descripción).', true);
    }

    guardarNube(puntos);
    abrirMapeo(mod, puntos.filter(p => !p.auxiliar));
  } catch(err){
    toast(err.message || String(err), true);
  }
}

/* La nube del último archivo se conserva aunque se cancele el mapeo: es lo que
   permite luego escribir un número de punto y recuperar sus coordenadas. */
function guardarNube(puntos){
  PROY.nube = puntos.map(p => ({pto:String(p.pto), e:p.e, n:p.n, z:p.z, desc:p.desc || ''}));
}
function buscarPunto(id){
  const clave = String(id == null ? '' : id).trim().toUpperCase();
  if (!clave) return null;
  return (PROY.nube || []).find(p => p.pto.trim().toUpperCase() === clave) || null;
}

/* Autocompletado: devuelve true si rellenó algo. */
function autocompletar(mod, fila, campo, valor){
  const p = buscarPunto(valor);
  if (!p) return false;
  if (mod === 'deflexion'){
    fila.e = p.e; fila.n = p.n; fila.z = p.z;
    if (!String(fila.desc || '').trim()) fila.desc = p.desc;
  } else if (mod === 'verticalidad'){
    if (campo === 'ptoSup'){ fila.eSup = p.e; fila.nSup = p.n; fila.zSup = p.z; }
    else { fila.eBase = p.e; fila.nBase = p.n; fila.zBase = p.z; }
    if (!String(fila.eje || '').trim() && p.desc) fila.eje = ejeDesdeDescripcion(p.desc);
  }
  return true;
}

/* Matriz de celdas → puntos PENZD. Salta la fila de encabezado si E/N/Z no son
   numéricos, y admite que la hoja tenga columnas de más a la derecha. */
function matrizAPuntos(matriz){
  const out = [];
  matriz.forEach((fila, i) => {
    if (!fila || fila.length < 4) return;
    const e = num(fila[1], NaN), n = num(fila[2], NaN), z = num(fila[3], NaN);
    if (!Number.isFinite(e) || !Number.isFinite(n) || !Number.isFinite(z)) return;  // encabezado
    const desc = String(fila[4] == null ? '' : fila[4]).trim();
    out.push({ pto:String(fila[0] == null ? '' : fila[0]).trim(), e, n, z, desc,
               auxiliar: desc === '' && !/^\d+$/.test(String(fila[0]||'')), linea:i+1 });
  });
  return out;
}

/* --------------------------------------------------------- Propuestas ----- */
function proponerVerticalidad(puntos){
  const grupos = new Map();
  puntos.forEach(p => {
    const eje = ejeDesdeDescripcion(p.desc);
    if (!eje) return;
    if (!grupos.has(eje)) grupos.set(eje, []);
    grupos.get(eje).push(p);
  });
  const out = [];
  grupos.forEach((lista, eje) => {
    if (lista.length < 2) return;
    /* Se toman los EXTREMOS DE COTA, no el rol declarado. En los archivos
       reales hay rótulos equivocados —COL-4F_BASE a la misma altura que el
       TOP, COL_3.1A_BASE en las dos puntas de la columna— y fiarse del texto
       daba alturas de 0 mm. El rol declarado se usa solo para avisar de la
       discrepancia en la pantalla de mapeo. */
    const porZ = lista.slice().sort((a,b) => b.z - a.z);
    const sup = porZ[0], base = porZ[porZ.length - 1];
    if (sup === base) return;
    const rSup = rolDesdeDescripcion(sup.desc), rBase = rolDesdeDescripcion(base.desc);
    out.push({
      incluir: true, eje, sup, base, candidatos: lista,
      conflicto: (rSup === 'base' || rBase === 'sup'),
      nPuntos: lista.length
    });
  });
  out.sort((a,b) => a.eje.localeCompare(b.eje, 'es', {numeric:true}));
  return out;
}

function proponerDeflexion(puntos){
  if (puntos.length < 2) return [];
  // Los dos puntos más separados definen el eje del tramo
  let iA = 0, iB = 1, dMax = -1;
  for (let i = 0; i < puntos.length; i++)
    for (let j = i+1; j < puntos.length; j++){
      const d = Math.hypot(puntos[i].e - puntos[j].e, puntos[i].n - puntos[j].n);
      if (d > dMax){ dMax = d; iA = i; iB = j; }
    }
  const A = puntos[iA], B = puntos[iB];
  const dE = B.e - A.e, dN = B.n - A.n, den = dE*dE + dN*dN;
  const conT = puntos.map(p => ({p, t: den ? ((p.e-A.e)*dE + (p.n-A.n)*dN) / den : 0}));
  conT.sort((a,b) => a.t - b.t);
  return conT.map((x, i) => ({
    incluir: true, pto:x.p.pto, e:x.p.e, n:x.p.n, z:x.p.z, desc:x.p.desc,
    rol: i === 0 ? 'A' : i === conT.length-1 ? 'B' : 'I'
  }));
}

/* Nivelación: lógica INFERIDA (el Excel parte de valores ya calculados). */
function proponerNivelacion(puntos, modoRef){
  const grupos = new Map();
  puntos.forEach(p => {
    const eje = ejeDesdeDescripcion(p.desc);
    if (!eje) return;
    if (!grupos.has(eje)) grupos.set(eje, []);
    grupos.get(eje).push(p);
  });
  const out = [];
  grupos.forEach((lista, eje) => {
    const cE = media(lista.map(p => p.e)), cN = media(lista.map(p => p.n));
    const zRef = media(lista.map(p => p.z));
    const cuad = {NO:[], NE:[], SO:[], SE:[]};
    lista.forEach(p => {
      const norte = p.n >= cN, este = p.e >= cE;
      cuad[norte ? (este ? 'NE' : 'NO') : (este ? 'SE' : 'SO')].push(p.z);
    });
    const dev = q => cuad[q].length ? excelRound((media(cuad[q]) - zRef) * 1000, 0) : 0;
    /* Un cuadrante sin puntos devuelve 0, que se lee igual que "esquina a nivel".
       Se cuenta para avisar: es falta de dato, no ausencia de desviación. */
    const vacios = ['NO','NE','SO','SE'].filter(q => !cuad[q].length);
    out.push({ incluir:true, eje, no:dev('NO'), ne:dev('NE'), so:dev('SO'), se:dev('SE'),
               zRef, nPuntos:lista.length, vacios });
  });
  out.sort((a,b) => a.eje.localeCompare(b.eje, 'es', {numeric:true}));
  return out;
}

/* ------------------------------------------------------- Modal de mapeo --- */
let MAPEO = null;

function abrirMapeo(mod, puntos){
  MAPEO = { mod, puntos, cdci:false };
  $('#mapTitle').textContent = 'Mapeo de puntos — ' + TITULOS[mod];
  pintarMapeo();
  $('#mapModal').hidden = false;
}
function cerrarMapeo(){ $('#mapModal').hidden = true; MAPEO = null; }

function pintarMapeo(){
  const {mod} = MAPEO;
  let pts = MAPEO.puntos, avisoCDCI = '';

  if (MAPEO.cdci){
    const {puntos, pares} = promediarCarasCDCI(MAPEO.puntos);
    pts = puntos;
    avisoCDCI = pares.length
      ? '<div class="note" style="margin-bottom:12px"><b>' + pares.length + ' par(es) CD/CI promediados.</b> ' +
        'Mayor discrepancia entre caras: ' + fmt(Math.max.apply(null, pares.map(p => p.discrepanciaMm)), 1) + ' mm. ' +
        pares.slice(0,6).map(p => esc(p.desc) + ' (' + fmt(p.discrepanciaMm,1) + ' mm)').join(' · ') +
        (pares.length > 6 ? ' …' : '') + '</div>'
      : '<div class="note warn" style="margin-bottom:12px">No se encontraron lecturas duplicadas del mismo punto dentro del radio de 50 mm.</div>';
  }
  MAPEO.procesados = pts;

  const cab = '<div class="note" style="margin-bottom:12px">' + pts.length +
    ' punto(s) de obra leídos. Revisa la propuesta antes de aplicar: todo es editable.</div>' +
    '<label class="chk" style="margin-bottom:12px"><input type="checkbox" id="chkCDCI"' + (MAPEO.cdci ? ' checked' : '') + '>' +
    '<span>Promediar lecturas en dos caras (círculo directo / inverso). Agrupa registros con la misma descripción ' +
    'y coordenadas dentro de 50 mm, y muestra la discrepancia como control de calidad.</span></label>' + avisoCDCI;

  let cuerpo = '';
  if (mod === 'verticalidad'){
    const props = MAPEO.props = proponerVerticalidad(pts);
    const conflictos = props.filter(p => p.conflicto).length;
    if (!props.length) cuerpo = '<div class="note bad">No se pudieron formar pares superior/base. Revisa que las descripciones identifiquen el eje y el nivel (p. ej. <code>COL_1B_TOP</code> / <code>COL_1B_BASE</code>), o carga los datos manualmente.</div>';
    else cuerpo =
      '<div class="note" style="margin-bottom:10px">El punto superior y el de base se eligen por <b>cota extrema</b> de cada grupo, no por el texto del rótulo: ' +
      'en los archivos de campo hay rótulos equivocados que darían alturas de 0 mm.' +
      (conflictos ? ' <b>' + conflictos + ' grupo(s)</b> tienen el rótulo en contra de la cota — marcados con ⚠, revísalos.' : '') + '</div>' +
      '<div class="gridwrap"><table class="grid"><thead><tr><th>Usar</th><th>Eje</th><th>Pts</th><th>Punto superior</th><th>Punto base</th><th>ΔE (mm)</th><th>ΔN (mm)</th><th>H (mm)</th></tr></thead><tbody>' +
      props.map((p,i) => {
        const dE = (p.sup.e - p.base.e)*1000, dN = (p.sup.n - p.base.n)*1000, H = (p.sup.z - p.base.z)*1000;
        return '<tr><td style="text-align:center"><input type="checkbox" data-map="incluir" data-i="' + i + '"' + (p.incluir ? ' checked' : '') + '></td>' +
          '<td><input type="text" data-map="eje" data-i="' + i + '" value="' + esc(p.eje) + '"></td>' +
          '<td style="text-align:center">' + p.nPuntos + (p.conflicto ? ' <span title="El rótulo contradice la cota">⚠</span>' : '') + '</td>' +
          '<td>' + esc(p.sup.pto) + ' · ' + esc(p.sup.desc) + '</td>' +
          '<td>' + esc(p.base.pto) + ' · ' + esc(p.base.desc) + '</td>' +
          '<td style="text-align:right">' + fmtSigno(dE,1) + '</td>' +
          '<td style="text-align:right">' + fmtSigno(dN,1) + '</td>' +
          '<td style="text-align:right">' + fmt(H,0) + '</td></tr>';
      }).join('') + '</tbody></table></div>';

  } else if (mod === 'deflexion'){
    /* Un levantamiento de cubierta mezcla familias de puntos (eje de cumbrera,
       hombros, puntos libres). Solo los de UNA familia definen un tramo, así
       que hay que filtrar antes de proyectar sobre la cuerda. */
    const familias = new Map();
    pts.forEach(p => familias.set(p.desc, (familias.get(p.desc) || 0) + 1));
    const filtro = (MAPEO.filtro || '').trim().toUpperCase();
    const filtrados = filtro ? pts.filter(p => String(p.desc).toUpperCase().indexOf(filtro) >= 0) : pts;
    const props = MAPEO.props = proponerDeflexion(filtrados);

    cuerpo =
      '<div class="note warn" style="margin-bottom:10px"><b>Filtra primero la familia de puntos.</b> ' +
      'Solo deben entrar las lecturas del mismo elemento: si se cuelan puntos de hombro o auxiliares, ' +
      'la cuerda teórica se traza entre extremos equivocados.</div>' +
      '<div class="field" style="margin-bottom:10px"><label>Filtrar por descripción (contiene)</label>' +
      '<input type="text" id="filtroDesc" value="' + esc(MAPEO.filtro || '') + '" placeholder="p. ej. EJE"></div>' +
      '<div style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px">' +
      Array.from(familias.entries()).sort((a,b) => b[1]-a[1]).map(([d,n]) =>
        '<button class="btn sm" data-fam="' + esc(d) + '">' + esc(d || '(sin descripción)') + ' · ' + n + '</button>').join('') +
      '</div>' +
      '<div class="note" style="margin-bottom:10px">' + filtrados.length + ' de ' + pts.length +
      ' puntos seleccionados. Los dos más separados se marcan como apoyos; el resto queda ordenado por su proyección sobre la cuerda.</div>' +
      '<div class="gridwrap"><table class="grid"><thead><tr><th>Usar</th><th>Punto</th><th>Descripción</th><th>Este</th><th>Norte</th><th>Cota Z</th><th>Rol</th></tr></thead><tbody>' +
      props.map((p,i) =>
        '<tr><td style="text-align:center"><input type="checkbox" data-map="incluir" data-i="' + i + '"' + (p.incluir ? ' checked' : '') + '></td>' +
        '<td>' + esc(p.pto) + '</td><td>' + esc(p.desc) + '</td>' +
        '<td style="text-align:right">' + fmt(p.e,3) + '</td>' +
        '<td style="text-align:right">' + fmt(p.n,3) + '</td>' +
        '<td style="text-align:right">' + fmt(p.z,3) + '</td>' +
        '<td><select data-map="rol" data-i="' + i + '">' +
          ['A','I','B'].map(r => '<option value="' + r + '"' + (p.rol===r?' selected':'') + '>' +
            (r==='A'?'Soporte A':r==='B'?'Soporte B':'Intermedio') + '</option>').join('') +
        '</select></td></tr>').join('') + '</tbody></table></div>';

  } else {
    const props = MAPEO.props = proponerNivelacion(pts);
    cuerpo = '<div class="note warn" style="margin-bottom:12px"><b>Cálculo inferido, no derivado del Excel.</b> ' +
      'El libro de referencia recibe las cuatro desviaciones ya calculadas a mano. Aquí se agrupan los puntos por placa, ' +
      'se asigna cada esquina por su cuadrante respecto del centroide y se resta la <b>cota media de la propia placa</b> ' +
      'como referencia. Si el criterio del proyecto es otro (cota de diseño por placa), corrige los valores tras aplicar ' +
      'o usa la carga manual.</div>' +
      (props.some(p => p.vacios.length)
        ? '<div class="note bad" style="margin-bottom:10px"><b>Cuadrantes sin puntos.</b> ' +
          props.filter(p => p.vacios.length).map(p => esc(p.eje) + ' (' + p.vacios.join(', ') + ')').join(' · ') +
          '. Esas esquinas salen como 0 mm, que se lee igual que «a nivel» — pero es falta de dato, no ausencia de desviación. ' +
          'Corrige a mano o vuelve a levantar la placa.</div>'
        : '') +
      '<div class="gridwrap"><table class="grid"><thead><tr><th>Usar</th><th>Eje</th><th>Puntos</th><th>Z ref (m)</th><th>NO</th><th>NE</th><th>SO</th><th>SE</th></tr></thead><tbody>' +
      props.map((p,i) =>
        '<tr><td style="text-align:center"><input type="checkbox" data-map="incluir" data-i="' + i + '"' + (p.incluir ? ' checked' : '') + '></td>' +
        '<td><input type="text" data-map="eje" data-i="' + i + '" value="' + esc(p.eje) + '"></td>' +
        '<td style="text-align:right">' + p.nPuntos + (p.vacios.length ? ' <span title="Cuadrantes sin punto: ' + p.vacios.join(', ') + '">⚠</span>' : '') + '</td>' +
        '<td style="text-align:right">' + fmt(p.zRef,3) + '</td>' +
        ['no','ne','so','se'].map(k => '<td><input class="num" type="text" data-map="' + k + '" data-i="' + i + '" value="' + p[k] + '"></td>').join('') +
        '</tr>').join('') + '</tbody></table></div>';
  }
  $('#mapBody').innerHTML = cab + cuerpo;
}

function aplicarMapeo(){
  if (!MAPEO || !MAPEO.props) return cerrarMapeo();
  const {mod, props} = MAPEO;
  const usados = props.filter(p => p.incluir);
  if (!usados.length){ toast('No hay filas seleccionadas.', true); return; }

  if (mod === 'verticalidad'){
    PROY.verticalidad = usados.map(p => ({
      eje: p.eje, ptoSup: String(p.sup.pto), ptoBase: String(p.base.pto),
      eSup:p.sup.e, nSup:p.sup.n, zSup:p.sup.z,
      eBase:p.base.e, nBase:p.base.n, zBase:p.base.z,
      hNominalMm:'', origen:'medido'
    }));
  } else if (mod === 'deflexion'){
    PROY.deflexion = usados.map(p => ({pto:p.pto, e:p.e, n:p.n, z:p.z, desc:p.desc, rol:p.rol, origen:'medido'}));
  } else {
    PROY.nivelacion = usados.map(p => ({eje:p.eje, no:num(p.no,0), ne:num(p.ne,0), so:num(p.so,0), se:num(p.se,0), origen:'medido'}));
  }
  cerrarMapeo();
  render();
  toast(usados.length + ' fila(s) aplicadas a ' + TITULOS[mod].toLowerCase());
}

/* ------------------------------------------------------------ Exportación */
async function manejarExport(btn){
  const cont = document.getElementById(btn.dataset.target);
  if (!cont) return;
  const nombre = btn.dataset.nombre || 'grafico';
  try{
    if (btn.dataset.exp === 'svg'){
      const blob = exportarSVG(cont);
      const url = descargar(nombreArchivo(PROY, nombre, 'svg'), blob);
      if (EMBEBIDO) abrirDescarga(nombre, nombreArchivo(PROY, nombre, 'svg'), url, null);
      else toast('SVG descargado');
      return;
    }
    if (btn.dataset.exp === 'copy'){
      await copiarPNG(cont, +btn.dataset.dpi, +btn.dataset.mm);
      return toast('Imagen copiada — pégala en Word o PowerPoint');
    }
    const {blob, w, h} = await exportarPNG(cont, +btn.dataset.dpi, +btn.dataset.mm);
    const archivo = nombreArchivo(PROY, nombre, 'png');
    const url = descargar(archivo, blob);
    if (EMBEBIDO) abrirDescarga(nombre, archivo, url, w + ' × ' + h + ' px');
    else toast('PNG ' + w + '×' + h + ' px descargado');
  } catch(err){ toast(err.message || String(err), true); }
}

/* Panel de rescate: muestra el archivo ya generado y ofrece las tres vías que
   sí funcionan dentro de un iframe — el enlace, el portapapeles y el clásico
   clic derecho sobre la propia imagen. */
function abrirDescarga(titulo, archivo, url, medida){
  const m = $('#dlModal');
  $('#dlTitulo').textContent = titulo;
  $('#dlMeta').textContent = archivo + (medida ? ' · ' + medida : '');
  const a = $('#dlLink');
  a.href = url; a.download = archivo;
  $('#dlVista').innerHTML =
      /\.zip$/i.test(archivo)  ? '<div style="padding:18px;color:var(--n500);font-size:13px">Todas las láminas del informe, a 300 dpi, en un solo archivo comprimido. Pulsa <b>Guardar archivo</b>.</div>'
    : /\.json$/i.test(archivo) ? '<div style="padding:18px;color:var(--n500);font-size:13px">Archivo de proyecto listo para guardar.</div>'
    : /\.svg$/i.test(archivo)  ? '<object data="' + url + '" type="image/svg+xml" style="max-width:100%;max-height:52vh"></object>'
    : '<img src="' + url + '" alt="' + esc(titulo) + '" style="max-width:100%;max-height:52vh;display:block;margin:0 auto">';
  m.hidden = false;
}

/* ---------------------------------------------------------------------------
 * ZIP (sin compresión, método «store»)
 * ---------------------------------------------------------------------------
 * «Exportar todo» disparaba una descarga por lámina, y un navegador dentro de
 * un iframe bloquea la segunda y las siguientes — de ahí el aviso de «guarda de
 * una en una», que no era un arreglo sino una rendición. Un único .zip es UNA
 * sola descarga: funciona igual incrustada que suelta. Escribirlo a mano cuesta
 * cuarenta líneas y evita traer una librería, que es lo que este archivo no
 * quiere hacer (ya lee .xlsx con su propio lector ZIP).
 * ------------------------------------------------------------------------- */
const CRC_TABLA = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLA[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipBytes(archivos){
  const cod = new TextEncoder();
  const locales = [], central = [];
  let desplazamiento = 0;
  archivos.forEach(f => {
    const nombre = cod.encode(f.nombre), datos = f.bytes, crc = crc32(datos);
    const L = new DataView(new ArrayBuffer(30));
    L.setUint32(0, 0x04034b50, true);   // firma de cabecera local
    L.setUint16(4, 20, true);           // versión necesaria
    L.setUint16(6, 0x0800, true);       // nombres en UTF-8
    L.setUint16(8, 0, true);            // método 0 = almacenado
    L.setUint16(10, 0, true);           // hora
    L.setUint16(12, 0x21, true);        // fecha fija 1980-01-01 → zip reproducible
    L.setUint32(14, crc, true);
    L.setUint32(18, datos.length, true);
    L.setUint32(22, datos.length, true);
    L.setUint16(26, nombre.length, true);
    locales.push(new Uint8Array(L.buffer), nombre, datos);

    const D = new DataView(new ArrayBuffer(46));
    D.setUint32(0, 0x02014b50, true);   // firma de directorio central
    D.setUint16(4, 20, true); D.setUint16(6, 20, true);
    D.setUint16(8, 0x0800, true); D.setUint16(10, 0, true);
    D.setUint16(12, 0, true); D.setUint16(14, 0x21, true);
    D.setUint32(16, crc, true);
    D.setUint32(20, datos.length, true);
    D.setUint32(24, datos.length, true);
    D.setUint16(28, nombre.length, true);
    D.setUint32(42, desplazamiento, true);
    central.push(new Uint8Array(D.buffer), nombre);
    desplazamiento += 30 + nombre.length + datos.length;
  });
  const tamCentral = central.reduce((s,a) => s + a.length, 0);
  const F = new DataView(new ArrayBuffer(22));
  F.setUint32(0, 0x06054b50, true);     // fin del directorio central
  F.setUint16(8, archivos.length, true);
  F.setUint16(10, archivos.length, true);
  F.setUint32(12, tamCentral, true);
  F.setUint32(16, desplazamiento, true);

  const trozos = locales.concat(central, [new Uint8Array(F.buffer)]);
  const total = trozos.reduce((s,a) => s + a.length, 0);
  const salida = new Uint8Array(total);
  let p = 0;
  trozos.forEach(a => { salida.set(a, p); p += a.length; });
  return salida;
}
/* El .zip se arma en un Uint8Array y no directamente en un Blob para que la
   validación pueda inspeccionar sus firmas y CRC sin esperar a una promesa. */
function zipStore(archivos){
  return new Blob([zipBytes(archivos)], {type:'application/zip'});
}

async function exportarTodo(){
  const bloques = [];
  const {niv, ver, pla, def} = RES;
  const hayPlano = pla.ejesX.length && pla.ejesY.length;
  if (niv.filas.length){
    bloques.push(['01_Tabla_Nivelacion', tablaNivelacion(niv, PROY)]);
    bloques.push(['02_Grafico_Nivelacion', graficoNivelacion(niv)]);
    if (hayPlano) bloques.push(['03_Plano_Nivelacion', graficoPlanoNivelacion(pla, niv, PROY)]);
    bloques.push(['04_Conclusiones_Nivelacion', bloqueConclusiones('nivelacion', niv, PROY)]);
  }
  if (ver.filas.length){
    bloques.push(['05_Tabla_Verticalidad', tablaVerticalidad(ver, PROY)]);
    bloques.push(['06_Grafico_Verticalidad_Severidad', graficoVerticalidadSeveridad(ver)]);
    if (hayPlano) bloques.push(['07_Plano_Verticalidad', graficoPlanoCombinado(pla, ver, niv, PROY)]);
    bloques.push(['08_Conclusiones_Verticalidad', bloqueConclusiones('verticalidad', ver, PROY)]);
  }
  if (hayPlano) bloques.push(['09_Plano_de_Ejes', graficoPlanoEjes(pla, ver)]);
  if (def.tramosVisibles.length){
    bloques.push(['10_Tabla_Deflexion', tablaDeflexion(def, PROY)]);
    bloques.push(['11_Grafico_Deflexion', graficoDeflexion(def)]);
    bloques.push(['12_Conclusiones_Deflexion', bloqueConclusiones('deflexion', def, PROY)]);
  }
  if (!bloques.length) return toast('No hay nada que exportar todavía.', true);

  const caja = document.createElement('div');
  caja.style.cssText = 'position:fixed;left:-99999px;top:0;width:1600px';
  document.body.appendChild(caja);
  try{
    toast('Generando ' + bloques.length + ' láminas a 300 dpi…');
    const archivos = [];
    for (const [nombre, svg] of bloques){
      caja.innerHTML = svg;
      /* mm = 0 → ancho natural de cada lámina: las de plano son apaisadas de
         250 mm y forzarlas a 170 las encogía. */
      const {blob} = await exportarPNG(caja, 300, 0);
      archivos.push({nombre: nombre + '.png', bytes: new Uint8Array(await blob.arrayBuffer())});
    }
    const zip = zipStore(archivos);
    const archivo = nombreArchivo(PROY, 'Reporte_completo', 'zip');
    const url = descargar(archivo, zip);
    if (EMBEBIDO) abrirDescarga('Reporte completo', archivo, url,
      archivos.length + ' imágenes · ' + Math.round(zip.size/1024) + ' KB');
    else toast(archivos.length + ' láminas exportadas en un .zip');
  } catch(err){ toast(err.message || String(err), true); }
  finally{ caja.remove(); }
}

/* -------------------------------------------------------- Persistencia --- */
function guardarProyecto(){
  const datos = JSON.stringify(PROY, null, 2);
  const archivo = nombreArchivo(PROY, 'proyecto', 'json');
  const url = descargar(archivo, new Blob([datos], {type:'application/json'}));
  if (EMBEBIDO) abrirDescarga('Proyecto', archivo, url, Math.round(datos.length/1024) + ' KB');
  else toast('Proyecto guardado');
}
async function cargarProyecto(){
  const f = await pedirArchivo('.json,application/json', true);
  if (!f) return;
  try{
    const p = JSON.parse(f.contenido);
    PROY = Object.assign(clonar(PROYECTO_VACIO), p);
    PROY.params = Object.assign(clonar(PROYECTO_VACIO.params), p.params || {});
    sincronizarCabecera();
    render();
    toast('Proyecto cargado: ' + (PROY.nombre || f.nombre));
  } catch(err){ toast('El archivo no es un proyecto válido: ' + err.message, true); }
}
function sincronizarCabecera(){
  $('#projName').value = PROY.nombre || '';
  $('#projSub').value  = PROY.ubicacion || '';
  sincronizarTema();
}

/* El tema viaja en el .json del proyecto. Un archivo guardado antes de que
   existieran los temas no trae `params.reporte`, y un id desconocido tampoco
   debe romper la carga: en ambos casos se cae al tema por defecto. */
function sincronizarTema(){
  if (!PROY.params.reporte) PROY.params.reporte = { tema: TEMA_POR_DEFECTO };
  const t = aplicarTema(PROY.params.reporte.tema);
  PROY.params.reporte.tema = t.id;
  const sel = $('#selTema');
  if (sel){
    if (!sel.options.length)
      sel.innerHTML = TEMAS.map(x =>
        '<option value="' + x.id + '">' + esc(x.nombre) + '</option>').join('');
    sel.value = t.id;
  }
  const nota = $('#temaNota');
  if (nota) nota.textContent = t.nota;
}

/* Altura de diseño: escribe zSup una sola vez y guarda la cota medida. */
function aplicarAlturasDiseno(){
  let n = 0;
  PROY.verticalidad.forEach(c => {
    const h = num(c.hNominalMm, NaN);
    if (!Number.isFinite(h) || h === 0) return;
    if (c.zSupMedido == null || c.zSupMedido === '') c.zSupMedido = num(c.zSup, 0);
    c.zSup = num(c.zBase, 0) + h / 1000;
    n++;
  });
  if (!n) return toast('Ninguna fila tiene altura de diseño escrita.', true);
  render();
  toast(n + ' columna(s) recalculadas con su altura de diseño');
}

/* ================================================================ EVENTOS = */
document.addEventListener('click', ev => {
  const nav = ev.target.closest('.nav-item');
  if (nav){ VISTA = nav.dataset.view; render(); window.scrollTo(0,0); return; }

  const tab = ev.target.closest('.tab');
  if (tab){
    const cont = tab.closest('.card');
    $$('.tab', cont).forEach(t => t.setAttribute('aria-selected', String(t === tab)));
    $$('.tabpane', cont).forEach(p => { p.hidden = p.id !== tab.dataset.pane; });
    return;
  }

  const dz = ev.target.closest('.dropzone');
  if (dz){ importar(dz.dataset.import, dz.dataset.fmt); return; }

  const exp = ev.target.closest('[data-exp]');
  if (exp){ manejarExport(exp); return; }

  const add = ev.target.closest('[data-add]');
  if (add){ PROY[add.dataset.add].push(NUEVA[add.dataset.add]()); render(); return; }

  const del = ev.target.closest('[data-del]');
  if (del){ PROY[del.dataset.del].splice(+del.dataset.i, 1); render(); return; }

  const fam = ev.target.closest('[data-fam]');
  if (fam && MAPEO){ MAPEO.filtro = fam.dataset.fam; pintarMapeo(); return; }

  if (ev.target.closest('[data-close-dl]')){ $('#dlModal').hidden = true; return; }
  if (ev.target.closest('[data-close-modal]')) return cerrarMapeo();
  if (ev.target.id === 'mapApply')  return aplicarMapeo();
  if (ev.target.id === 'btnSave')   return guardarProyecto();
  if (ev.target.id === 'btnLoad')   return cargarProyecto();
  if (ev.target.id === 'btnExportAll') return exportarTodo();
  if (ev.target.id === 'btnAplicarH')  return aplicarAlturasDiseno();
  if (ev.target.id === 'btnDemo'){
    PROY = clonar(PROYECTO_VALIDACION); sincronizarCabecera(); render();
    return toast('Datos de validación cargados (Bahías 22-23)');
  }
  if (ev.target.id === 'btnNew'){
    PROY = clonar(PROYECTO_VACIO); sincronizarCabecera(); render();
    return toast('Proyecto vacío');
  }
});

/* Edición en las rejillas: se actualiza el modelo y se repintan SOLO las
   salidas, para no perder el foco del campo que se está escribiendo. */
document.addEventListener('input', ev => {
  const t = ev.target;

  if (t.id === 'projName'){ PROY.nombre = t.value; $('#crumbProj').textContent = t.value || 'Proyecto sin nombre'; return; }
  if (t.id === 'projSub'){  PROY.ubicacion = t.value; actualizarSalidas(); return; }

  if (t.dataset.mod){
    const mod = t.dataset.mod, campo = t.dataset.k;
    const fila = PROY[mod][+t.dataset.i];
    if (!fila) return;
    fila[campo] = t.value;

    /* Al escribir un número de punto se recuperan sus coordenadas de la nube
       ya cargada. Si el punto no existe no se borra nada: solo no se rellena. */
    const esId = (mod === 'deflexion' && campo === 'pto') ||
                 (mod === 'verticalidad' && (campo === 'ptoSup' || campo === 'ptoBase'));
    if (esId && (PROY.nube || []).length && String(t.value).trim()){
      if (autocompletar(mod, fila, campo, t.value)){
        const foco = campo, i = t.dataset.i;
        render();
        const nuevo = document.querySelector('[data-mod="'+mod+'"][data-i="'+i+'"][data-k="'+foco+'"]');
        if (nuevo){ nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
        return;
      }
    }
    actualizarSalidas();
    return;
  }

  if (t.dataset.par){
    const [grupo, campo] = t.dataset.par.split('.');
    if (t.tagName === 'SELECT' && t.value === '__custom') return;
    PROY.params[grupo][campo] = PAR_TEXTO.indexOf(campo) >= 0 ? t.value : num(t.value, PROY.params[grupo][campo]);
    /* Las observaciones se repintan al salir del campo, no en cada tecla:
       repintar aquí destruiría el propio textarea y perdería el foco. */
    if (campo === 'observaciones') return;
    /* Lectura del valor junto a los deslizadores: el repintado solo alcanza a
       #salidas, así que el rail no se refrescaría por su cuenta. */
    $$('[data-eco="' + t.dataset.par + '"]').forEach(n =>
      n.textContent = fmt(num(t.value, 0), 1) + ' mm');
    if (t.dataset.par === 'reporte.tema') sincronizarTema();
    if (t.tagName === 'SELECT') render(); else actualizarSalidas();
    return;
  }

  if (t.id === 'filtroDesc' && MAPEO){
    MAPEO.filtro = t.value;
    clearTimeout(MAPEO.__t);
    MAPEO.__t = setTimeout(() => {
      pintarMapeo();
      const n = $('#filtroDesc');
      if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 320);
    return;
  }

  if (t.dataset.map && MAPEO){
    const p = MAPEO.props[+t.dataset.i];
    if (!p) return;
    p[t.dataset.map] = t.type === 'checkbox' ? t.checked : t.value;
    return;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'chkCDCI' && MAPEO){ MAPEO.cdci = t.checked; pintarMapeo(); return; }
  if (t.tagName === 'TEXTAREA' && t.dataset.par){ actualizarSalidas(); return; }
  if (t.dataset.map && MAPEO){
    const p = MAPEO.props[+t.dataset.i];
    if (p) p[t.dataset.map] = t.type === 'checkbox' ? t.checked : t.value;
    return;
  }
  if (t.dataset.mod){
    const fila = PROY[t.dataset.mod][+t.dataset.i];
    if (fila){ fila[t.dataset.k] = t.value; actualizarSalidas(); }
    return;
  }
  if (t.dataset.par && t.tagName === 'SELECT'){
    if (t.value === '__custom') return;
    const [grupo, campo] = t.dataset.par.split('.');
    PROY.params[grupo][campo] = PAR_TEXTO.indexOf(campo) >= 0 ? t.value : num(t.value, PROY.params[grupo][campo]);
    /* El tema tiene que estar aplicado ANTES de repintar: el render lee `C` y
       `FUENTE`, que es justo lo que aplicarTema() acaba de cambiar. */
    if (t.dataset.par === 'reporte.tema') sincronizarTema();
    render();
  }
});

/* Arrastrar y soltar sobre las zonas de carga */
['dragenter','dragover'].forEach(e => document.addEventListener(e, ev => {
  const dz = ev.target.closest && ev.target.closest('.dropzone');
  if (dz){ ev.preventDefault(); dz.classList.add('over'); }
}));
['dragleave','drop'].forEach(e => document.addEventListener(e, ev => {
  const dz = ev.target.closest && ev.target.closest('.dropzone');
  if (dz) dz.classList.remove('over');
}));
document.addEventListener('drop', async ev => {
  const dz = ev.target.closest && ev.target.closest('.dropzone');
  if (!dz) return;
  ev.preventDefault();
  const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (!f) return;
  try{
    let puntos;
    if (/\.xlsx$/i.test(f.name)){
      const hojas = await leerXLSX(await f.arrayBuffer());
      const conDatos = hojas.filter(h => h.filas.length > 1);
      if (!conDatos.length) return toast('El libro no contiene filas de datos.', true);
      puntos = matrizAPuntos(conDatos[0].filas);
    } else {
      const txt = await f.text();
      puntos = /\.csv$/i.test(f.name) ? matrizAPuntos(parseCSV(txt)) : parsePENZD(txt).filas;
    }
    if (!puntos.length) return toast('No se reconoció ningún punto en ' + f.name, true);
    guardarNube(puntos);
    abrirMapeo(dz.dataset.import, puntos.filter(p => !p.auxiliar));
  } catch(err){ toast(err.message || String(err), true); }
});

/* ================================================================== INIT == */
if (new URLSearchParams(location.search).get('test') === '1') VISTA = 'tests';
sincronizarCabecera();
render();
</script>
